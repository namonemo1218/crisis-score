<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기업 살리기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;800&display=swap">
<style>
/* Layout: 설문지처럼 문항 카드가 한 줄로 이어지는 게임. 회사마다 표지 띠 색이 바뀌고, 결정할 때마다 회사 상태 게이지가 움직인다 */
:root{
  --bg:#ECF0EE; --surface:#FFFFFF; --soft:#F4F7F5; --fg:#18211D; --muted:#5A6862; --line:#D3DCD8;
  --gold:#D8920F; --good:#1C8A57; --warn:#C27C0E; --bad:#CC3F30; --info:#2F5FBF; --on-co:#FFFFFF;
  --co-car:#12805A; --co-food:#BF5814; --co-air:#1F6BB0; --co-chip:#5E43B3;
  --co:var(--co-car);
  --font-display:"Black Han Sans","Gothic A1","Malgun Gothic",sans-serif;
  --font-body:"Gothic A1","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111715; --surface:#1A221F; --soft:#212B27; --fg:#E4EBE7; --muted:#97A59F; --line:#2F3B36;
    --gold:#F0B436; --good:#4CC28A; --warn:#E9A53A; --bad:#F2725F; --info:#86A9F2; --on-co:#FFFFFF;
    --co-car:#17905F; --co-food:#C8621C; --co-air:#2878BF; --co-chip:#6C52C2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1A221F; --soft:#212B27; --fg:#E4EBE7; --muted:#97A59F; --line:#2F3B36;
  --gold:#F0B436; --good:#4CC28A; --warn:#E9A53A; --bad:#F2725F; --info:#86A9F2; --on-co:#FFFFFF;
  --co-car:#17905F; --co-food:#C8621C; --co-air:#2878BF; --co-chip:#6C52C2; color-scheme:dark;
}
.co-car{--co:var(--co-car)} .co-food{--co:var(--co-food)} .co-air{--co:var(--co-air)} .co-chip{--co:var(--co-chip)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.65;word-break:keep-all;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font-family:var(--font-display);font-weight:400;font-size:44px;line-height:1.1;letter-spacing:.01em}
h2{font-size:17px;font-weight:800;text-wrap:balance}
h3{font-size:14px;font-weight:800}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}

/* 표지 띠 */
.cover{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cover .band{background:var(--co);color:var(--on-co);padding:22px 22px 20px;position:relative;
  background-image:radial-gradient(rgba(255,255,255,.14) 1.5px,transparent 1.6px);background-size:14px 14px;display:flex;flex-direction:column;gap:6px}
.cover .band .tag{font-size:12.5px;font-weight:700;letter-spacing:.06em;opacity:.9}
.cover .band p{max-width:52ch;font-size:14.5px;opacity:.95}
.cover .body{padding:14px 22px 16px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--muted)}
.cover .body b{color:var(--fg)}

/* 탭 */
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;border-radius:7px;padding:9px 10px;font-weight:700;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--co);color:var(--on-co)}

/* 문항 카드 */
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.q-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.q-no{font-family:var(--font-display);font-size:20px;color:var(--co);line-height:1}
.q-h h2{flex:1;min-width:0}
.q-h .req{color:var(--bad);font-weight:800}
.q-sub{font-size:13.5px;color:var(--muted);margin-top:-8px}

/* 회사 고르기 */
.cos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cobtn{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;transition:border-color .15s,background .15s}
.cobtn:hover{background:var(--soft)}
.cobtn .ic{grid-row:1/3;width:44px;height:44px;border-radius:10px;background:var(--co);color:var(--on-co);display:grid;place-items:center;font-family:var(--font-display);font-size:22px}
.cobtn b{font-size:15.5px;min-width:0}
.cobtn span{font-size:12.5px;color:var(--muted);min-width:0}
.cobtn[aria-pressed="true"]{border-color:var(--co);background:color-mix(in srgb,var(--co) 8%,var(--surface))}
.cobtn[aria-pressed="true"] b::after{content:" ✓";color:var(--co)}

/* 조건 설정 */
.form-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center}
.form-row>label,.form-row>span.lb{font-size:13.5px;font-weight:700}
.txt{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;font-size:15px}
.txt:focus{border-color:var(--co);outline:0}
.radios{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.radios button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 6px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.radios button::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none}
.radios button[aria-pressed="true"]{border-color:var(--co);color:var(--fg)}
.radios button[aria-pressed="true"]::before{border-color:var(--co);background:radial-gradient(var(--co) 0 3.5px,transparent 4px)}
.effects{background:var(--soft);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.effects b{font-size:13px}
.effects ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.co-desc{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 10px;font-size:13.5px}
.co-desc dt{color:var(--muted);font-weight:700}
.co-desc dd{margin:0;min-width:0}

/* 난이도 */
.diffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.diffs button{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.diffs button b{font-size:15px}
.diffs button span{font-size:12px;color:var(--muted);line-height:1.45}
.diffs button[aria-pressed="true"]{border-color:var(--co);background:color-mix(in srgb,var(--co) 8%,var(--surface))}

/* 필터 */
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.frow .lb{font-size:12.5px;font-weight:700;width:58px;flex:none;color:var(--muted)}
.fchip{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:2px 12px;font-size:13px}
.fchip:hover{border-color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--co);border-color:var(--co);color:var(--on-co)}
.link{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px}

/* 스테이지 */
.stages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stg{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .15s,transform .15s}
.stg:hover{border-color:var(--co);transform:translateY(-2px)}
.stg .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.stars{color:var(--line);letter-spacing:1px;font-size:15px}
.stars i{font-style:normal;color:var(--gold)}
.stg .t{font-family:var(--font-display);font-size:19px;line-height:1.25}
.stg .d{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stg .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.stg .best{font-size:12.5px;color:var(--muted)}
.stg .best b{color:var(--fg);font-size:15px}
.chip{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.chip.set{background:color-mix(in srgb,var(--co) 14%,var(--surface));color:var(--co)}
.chip.sty{background:var(--fg);color:var(--surface)}
.chip.grp-loss{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.chip.grp-gain{color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.sec-t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:6px 2px 0}
.sec-t h2{font-family:var(--font-display);font-weight:400;font-size:22px}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:12px;padding:26px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* 진행 바 */
.prog{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.prog .row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:700}
.prog .track{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--co);border-radius:4px;transition:width .4s}

/* 회사 상태 게이지 */
.hud{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.gg{display:flex;flex-direction:column;gap:3px;min-width:0}
.gg .l{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gg .bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.gg .bar i{display:block;height:100%;border-radius:4px;transition:width .5s}
.gg .v{font-size:13px;font-weight:800;display:flex;gap:5px;align-items:baseline}
.dl{font-size:11px;font-weight:800}
.dl.up{color:var(--good)} .dl.dn{color:var(--bad)}
.lv-good{background:var(--good)} .lv-warn{background:var(--warn)} .lv-bad{background:var(--bad)}

/* 상황 */
.sit-t{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.timer{font-variant-numeric:tabular-nums;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--fg)}
.timer.low{background:var(--bad);color:var(--on-co)}
.sit-q{font-size:16.5px;line-height:1.75}
.goal{display:flex;gap:10px;align-items:baseline;background:var(--soft);border-radius:8px;padding:10px 14px;font-size:14.5px}
.goal b{flex:none;color:var(--co);font-size:13px}

/* 선택지 (라디오) */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--muted);background:var(--soft)}
.opt:disabled{cursor:default}
.opt .rd{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);margin-top:2px}
.opt .body{display:flex;flex-direction:column;gap:3px;min-width:0}
.opt .ds{font-size:13px;color:var(--muted)}
.opt.pick{border-color:var(--co);background:color-mix(in srgb,var(--co) 8%,var(--surface))}
.opt.pick .rd{border-color:var(--co);background:radial-gradient(var(--co) 0 5px,transparent 5.5px)}
.opt.dim{opacity:.45}
.hint{font-size:12px;font-weight:700;color:var(--info)}

/* 결정 메모 */
.memo-row{display:flex;flex-direction:column;gap:8px}
.memo-row>b{font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
textarea.txt{min-height:64px;resize:vertical;font-size:14px}
.foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* 결과 피드백 */
.fb-row{display:flex;flex-direction:column;gap:2px}
.fb-row b{font-size:12.5px;color:var(--muted)}
.fb-row p{font-size:14.5px}
.fb-row.trait p{color:var(--info)}
.case{background:var(--soft);border-radius:8px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.case b{font-size:12.5px;color:var(--co)}
.kw{display:flex;flex-wrap:wrap;gap:5px}
.kw span{font-size:11.5px;padding:0 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}

.cta{background:var(--co);color:var(--on-co);border:0;border-radius:9px;padding:12px 22px;font-weight:800;font-size:15px}
.cta:hover:not(:disabled){filter:brightness(1.08)}
.cta:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:11px 18px;font-weight:700}
.ghost:hover{border-color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.crumb{font-size:13px;font-weight:700;color:var(--muted)}

/* 점수 */
.score{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.score .band{background:var(--co);color:var(--on-co);padding:20px 22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  background-image:radial-gradient(rgba(255,255,255,.14) 1.5px,transparent 1.6px);background-size:14px 14px}
.score .n{font-family:var(--font-display);font-size:72px;line-height:1}
.score .n small{font-family:var(--font-body);font-size:16px;opacity:.85;font-weight:700}
.score .g{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.score .g .grade{font-size:13px;font-weight:700;opacity:.9}
.score .g b{font-size:18px}
.score .medal{width:76px;height:76px;border-radius:50%;background:var(--on-co);color:var(--co);display:grid;place-items:center;font-family:var(--font-display);font-size:38px;flex:none}
.score .sub{padding:12px 22px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.score .sub .stars{font-size:20px}
.survive{display:flex;flex-direction:column;gap:10px}
.survive .msg{font-weight:800;font-size:15px}

/* 막대 */
.dims{display:flex;flex-direction:column;gap:12px}
.dim-row .h{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.dim-row .h small{color:var(--muted);font-size:11.5px;margin-left:6px}
.dim-row .track{height:9px;background:var(--soft);border-radius:5px;margin-top:4px;overflow:hidden}
.dim-row .track i{display:block;height:100%;background:var(--muted);border-radius:5px}
.dim-row.top .track i{background:var(--co)}
.dim-row.na .h b{color:var(--muted);font-weight:400}
.ab-row .ex{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center}
.radar{width:100%;height:auto;display:block}
.style-main{display:flex;flex-direction:column;gap:6px}
.style-main .nm{font-family:var(--font-display);font-size:26px;color:var(--co)}
.style-main dl{margin:6px 0 0;display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px 10px;font-size:14px;background:var(--soft);border-radius:8px;padding:10px 12px}
.style-main dt{font-weight:800;font-size:12.5px}
.style-main dd{margin:0}
.rev{display:flex;flex-direction:column}
.rev-item{padding:16px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.rev-item:first-child{border-top:0;padding-top:0}
.rev-item .q2{font-weight:800}
.rev-item .a{font-size:14px}
.rev-item .a span.l{display:inline-block;min-width:36px;color:var(--muted);font-weight:700;margin-right:6px}
.why{font-size:14px;background:var(--soft);border-radius:6px;padding:6px 10px}
.kgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.kgrid h3{margin-bottom:8px}

/* 리포트 */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1.15}
.stat span{font-size:12.5px;color:var(--muted)}
.diag{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.hrow:first-child{border-top:0;padding-top:0}
.hrow .s{font-family:var(--font-display);font-size:22px;grid-row:1/3;grid-column:2;align-self:center}
.hrow .m{font-size:12.5px;color:var(--muted)}
.danger{background:transparent;border:1.5px solid var(--line);border-radius:9px;padding:9px 14px;font-size:13px;color:var(--muted)}
.danger:hover{border-color:var(--bad);color:var(--bad)}
.flash{border:1.5px solid var(--info);color:var(--info);border-radius:10px;padding:8px 12px;background:var(--surface);font-size:14px}
textarea.code{font:12px ui-monospace,Consolas,monospace;min-height:80px}

@media (max-width:600px){
  h1{font-size:36px}
  .q{padding:18px 16px}
  .cos,.stages{grid-template-columns:minmax(0,1fr)}
  .two,.kgrid{grid-template-columns:minmax(0,1fr)}
  .form-row{grid-template-columns:minmax(0,1fr);gap:6px}
  .diffs{grid-template-columns:minmax(0,1fr)}
  .hud{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stats{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .score .n{font-size:58px}
  .score .medal{width:60px;height:60px;font-size:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>

<body>

<div class="wrap" id="app"></div>

<script>
const DIMS=["초동 판단","재무 안정성","공급망 회복력","이해관계자","장기 경쟁력"];
const DSHORT=["초동","재무","공급망","신뢰","미래"];
const DDESC=["충격 직후 빠르게 움직여 피해가 번지는 것을 막는 힘","현금과 빚 부담을 버틸 수 있게 지키는 힘","부품·원자재 흐름이 끊기지 않게 하는 힘","협력사·노동자·고객·정부와의 신뢰","위기가 지난 뒤 시장에서 이길 수 있는 힘"];
const ABS=[
 ["dx","위기 진단력","결정 전에 이 위기에서 가장 먼저 지켜야 할 영역을 맞게 꼽았는가"],

function weightsFor(sc,tr){
  let w=sc.w.slice();
  WRULES.forEach(([on,ok,d])=>{if(on(tr)&&ok(sc)) w=w.map((v,k)=>v+d[k])});
  w=w.map(v=>Math.max(5,v)); const s=w.reduce((a,b)=>a+b,0);
  w=w.map(v=>Math.round(v*100/s)); const diff=100-w.reduce((a,b)=>a+b,0); w[w.indexOf(Math.max(...w))]+=diff;
  return w;
}
function modOpt(o,tr){

  return [o[0],o[1],s,o[3],o[4],notes];
}

}

  ["share","주문은 절반만 줄이고, 부품사가 지게 될 재고 비용 일부를 우리가 보전한다.",[2,2,2,3,1],"부품사와 관계가 좋아졌고, 반도체 업체 입장에서도 우리 물량이 완전히 빠지지 않았습니다.","두 목표를 절반씩 달성했습니다."],
  ["lean","주문은 줄이되 칩 업체 몇 곳과 '수요 회복 시 우선 공급' 옵션 계약을 맺어 둔다.",[3,3,2,1,1],"비용은 적었지만 옵션 계약은 법적 강제력이 약했습니다.","손실은 줄였습니다. 부족이 심해지자 옵션이 다 지켜지지 않아 회복기 생산이 일부 막혔습니다."],
  ["shift","판매가 줄어든 시간을 활용해 칩 사용량이 적은 전자 구조로 차종을 재설계한다.",[1,2,2,1,4],"개발비가 들었고 효과는 1~2년 뒤에 나옵니다.","이번 회복기에는 도움이 크지 않았습니다. 같은 부족이 다시 오면 영향이 작아집니다."]],
  c:"코로나 초기 부품사들이 반도체 주문을 대거 취소하자 반도체 업체는 라인을 IT용으로 돌렸고, 백신과 초저금리로 차 수요가 빨리 회복되면서 부족이 생겼습니다. 2021년 업계 생산 손실은 770만 대, 매출 손실은 2,100억 달러로 추정됩니다. 중견 완성차인 르노삼성은 부산공장을 처음으로 세웠습니다.",
  k:["절약의 역설","세계 경제의 파편화"]},
 {t:"4단계 · 정치 충격",q:"중국이 요소 수출을 사실상 막았습니다. 원인은 호주와의 무역 갈등입니다. 우리 디젤 SUV 고객은 요소수가 없으면 차를 운행할 수 없습니다. 한국 차량용 요소의 97%가 중국산입니다.",g:"디젤 SUV 고객의 운행 차질과 판매 감소를 막는다",o:[
  ["safe","확보한 요소수는 신차 출고에 먼저 쓰고, 기존 고객 대응은 정부 수급 대책에 맞춘다.",[2,3,1,1,2],"신차 출고는 이어졌지만 기존 고객은 직접 요소수를 구해야 했습니다.","신차 판매는 지켰습니다. 기존 고객 불만이 커져 다음 구매에 영향을 줄 수 있습니다."],
  ["bold","해외 각국에서 요소수를 비싸게 대량 수입해 우리 고객에게 무상으로 제공하고 이를 알린다.",[4,0,2,3,1],"비용이 크게 들었지만 언론과 고객 반응이 좋았습니다.","운행 차질은 크게 줄었고 브랜드 평판이 올랐습니다. 이익은 줄었습니다."],
  ["share","정부, 다른 완성차와 함께 요소수 공동 구매·배분에 참여한다.",[3,2,2,3,1],"우리 고객만 따로 챙기지는 못했지만 물류·화물 업계 전체의 차질이 줄었습니다.","우리 고객의 운행 차질은 다른 회사 고객과 같은 수준으로 줄었습니다."],
  ["lean","확보한 요소수를 시세에 가깝게 우리 고객에게만 판매해 비용을 회수한다.",[3,4,1,1,1],"손실 없이 공급을 이어 갔지만 '위기 장사'라는 비판도 일부 나왔습니다.","운행 차질은 줄였지만 고객 만족도는 기대만큼 오르지 않았습니다."],
  ["shift","디젤 SUV 생산 비중을 줄이고 가솔린·하이브리드 전환 일정을 앞당긴다.",[1,2,3,1,3],"요소수가 필요한 차량은 앞으로 줄어들지만 지금 고객이 겪는 차질에는 효과가 없습니다.","이번 운행 차질은 그대로였습니다. 같은 위험에 노출되는 판매 비중은 줄어듭니다."]],
  c:"중국은 2021년 10월 15일 요소 수출 전 검사를 의무화했습니다. 요소수 가격이 10배로 뛰었고 물류·건설 현장까지 멈췄습니다. SCR을 단 승합차 28만 대와 화물차 55만 대가 직접 타격을 받았습니다.",
  k:["탈세계화","세계 경제의 파편화"]},
 {t:"5단계 · 1년 뒤",q:"공급이 안정되자 분산과 비축 비용 때문에 다시 가장 싼 한 곳으로 모으자는 압력이 커졌습니다.",g:"공급 분산을 유지하면서 원가 경쟁력도 지킨다",o:[
  ["safe","분산 비용이 이익을 깎으니 가장 싼 공급처로 다시 모은다.",[2,4,0,1,2],"원가가 내려가 이익률이 회복됐습니다.","원가 목표는 달성했지만 분산은 사라졌습니다."],
  ["bold","분산 비용을 감수하고 동남아에 부품 조달 거점을 새로 세운다.",[2,1,4,1,2],"투자비가 들었지만 특정 국가 의존도가 크게 줄었습니다.","분산은 확실해졌지만 원가 부담이 늘었습니다."],
  ["share","핵심 품목의 국내 협력사 물량을 늘리고, 정부에 비축·다변화 지원 정책을 제안한다.",[1,2,3,3,1],"국내 협력사 일자리가 늘었고 정부 지원 논의가 시작됐습니다. 단가는 해외보다 높습니다.","분산은 일부 유지했습니다. 원가는 정부 지원이 나오는지에 달렸습니다."],
  ["lean","한 나라 의존도 상한(예: 50%)만 정하고, 그 안에서는 가장 싼 공급처를 쓴다.",[2,3,3,1,1],"원가 상승은 작았고 최악의 집중은 피했습니다.","두 목표를 적당히 맞췄습니다. 상한선 근처에서 다시 집중 압력이 생깁니다."],
  ["shift","공급처를 바꿔도 되도록 부품 규격을 표준화해 분산 비용 자체를 낮춘다.",[1,2,2,1,4],"표준화에 몇 년이 걸리고 초기 비용이 듭니다.","당장은 효과가 작습니다. 완성되면 분산과 원가를 함께 잡을 수 있습니다."]],
  c:"요소수 사태 뒤 중국 의존도는 67%까지 낮아졌다가 가격 때문에 다시 91%로 올라갔습니다.",
  k:["탈세계화","잠재 비용"]}
]},
{id:"oil",grp:"loss",src:"set",title:"석유파동형 스태그플레이션",cause:"원자재 가격",era:"1973~1980",
 desc:"유가가 한 달 만에 네 배로 뛰고 물가는 20%대로 치솟는데, 경기는 식어 갑니다. 원가와 임금, 금리가 한꺼번에 흔들립니다.",
 w:[20,25,15,15,25],steps:[
 {t:"1단계 · 유가 급등",q:"유가가 배럴당 3달러에서 한 달 만에 13달러로 뛰었습니다(1차 석유파동을 옮긴 상황). 철강·플라스틱·물류비가 오르고 소비자는 지갑을 닫기 시작했습니다.",g:"원가 급등 속에서 이익과 판매량을 함께 지킨다",o:[
  ["safe","원가 상승분만큼 가격을 올리고 생산량을 줄여 적자 판매를 막는다.",[3,4,1,0,1],"대당 이익은 지켰지만 판매량이 크게 줄고 협력사 물량도 줄었습니다.","이익은 지켰고 판매량은 놓쳤습니다."],
  ["bold","가격을 동결하고, 경쟁사가 가격을 올리는 사이 점유율을 가져온다.",[3,0,1,2,3],"점유율은 올랐지만 대당 손실이 쌓여 차입이 늘었습니다.","판매량은 지켰고 이익은 크게 줄었습니다. 위기가 길어지면 버티기 어렵습니다."],
  ["share","원가 상승분을 회사·협력사·소비자가 3분의 1씩 나누도록 협력사와 가격을 협상한다.",[2,2,2,3,1],"협상에 몇 주가 걸렸고 협력사 이익도 줄었습니다.","두 목표를 절반씩 지켰습니다."],
  ["lean","옵션을 줄인 저가 트림을 내고 기본 트림 가격은 올린다.",[4,3,1,1,1],"가격에 민감한 고객은 저가 트림으로 옮겨 갔고 평균 판매가는 내려갔습니다.","판매량은 어느 정도 지켰고 이익 감소도 제한했습니다."],
  ["shift","유가 수준별 원가표를 만들고 경량화·연비 개선 프로젝트에 바로 예산을 배정한다.",[2,1,2,1,4],"단기 손익에는 효과가 없고 개발비가 늘었습니다.","당장의 목표에는 기여가 작습니다. 다음 유가 충격 때 원가가 덜 흔들립니다."]],
  c:"1차 석유파동 때 유가는 배럴당 평균 3달러에서 한 달 만에 13달러가 됐습니다. 한국 소비자물가 상승률은 1973년 3.5%에서 1974년 24.3%, 1975년 25.2%로 뛰었습니다.",
  k:["인플레이션율","잠재 비용"]},
 {t:"2단계 · 임금 협상",q:"물가가 24% 오르자 노조는 물가만큼 임금을 올려 달라고 합니다. 판매는 줄고 있습니다.",g:"노사 갈등 없이 인건비 급증을 막는다",o:[
  ["safe","임금은 동결하고 대신 2년 고용 보장을 약속한다.",[2,4,1,2,1],"인건비는 묶였지만 실질임금이 크게 떨어져 숙련공 이직이 늘었습니다.","비용 목표는 달성했고 노사 관계는 불안해졌습니다."],
  ["bold","물가만큼 임금을 올리고, 그 대신 생산 목표를 높여 달라고 요구한다.",[3,1,1,3,2],"노조는 받아들였지만 인건비가 크게 뛰었습니다. 생산 목표를 채울지는 수요에 달렸습니다.","갈등은 피했고 인건비 급증은 막지 못했습니다."],
  ["share","저임금 직원부터 물가를 반영해 올리고, 고임금 직원과 임원은 동결한다.",[2,2,1,4,1],"노조 지지는 높았지만 관리직 일부가 떠났습니다.","갈등과 비용 증가를 모두 중간 수준에서 막았습니다."],
  ["lean","기본급은 조금만 올리고 성과급을 판매 실적에 연동한다.",[3,3,1,2,1],"고정비는 덜 늘었습니다. 판매가 줄면 실제 임금도 줄어 불만이 생길 수 있습니다.","비용 목표는 대부분 달성했고 갈등 가능성은 남았습니다."],
  ["shift","인상 폭을 줄이는 대신 자동화 투자와 직무 전환 교육을 함께 제안한다.",[1,2,1,2,4],"협상이 길어졌고 투자비가 들었습니다.","단기 목표 달성은 늦어졌습니다. 장기적으로 인건비 구조가 바뀝니다."]],
  c:"1974년 대통령 긴급조치로 저소득층 세금을 줄이고 사치성 소비를 억제했습니다. 정부도 물가 충격의 부담을 소득 계층별로 다르게 나누려 했습니다.",
  k:["블루칼라 노동자","인플레이션율"]},
 {t:"3단계 · 차입 구조",q:"은행이 단기 대출 연장 조건으로 금리를 20%로 올렸습니다. 물가 상승률은 24%입니다(수치는 가정). 대출을 어떻게 다룹니까?",g:"자금이 끊기지 않게 하면서 이자 부담을 줄인다",o:[
  ["safe","투자를 멈추고 가진 현금으로 대출을 최대한 갚는다.",[2,4,1,1,1],"부채는 줄었지만 운영자금과 신차 개발비가 바닥났습니다.","이자는 줄었지만 돈이 끊길 위험은 오히려 커졌습니다."],
  ["bold","실질금리가 마이너스(20% − 24% = −4%)이므로 더 빌려 원자재와 설비를 미리 사 둔다.",[3,1,2,1,3],"물가가 계속 오르면 빚의 실질 가치가 줄어 이득입니다. 매출이 줄면 이자 낼 현금이 모자랍니다.","계산상으로는 유리했지만 자금이 막힐 위험이 커졌습니다."],
  ["share","주거래은행에 매출·고용 정보를 정기적으로 공유하는 대신 금리를 조금 낮춰 달라고 협상한다.",[2,3,1,3,1],"금리가 약간 내려갔고 은행과 신뢰가 생겼지만 경영 자율성은 줄었습니다.","두 목표를 조금씩 달성했습니다."],
  ["lean","단기 대출은 계속 연장해 쓰고, 금리가 가장 높은 대출부터 갚는다.",[3,3,1,1,1],"당장은 큰 변화가 없었지만 연장할 때마다 조건이 나빠졌습니다.","이자는 조금 줄었고 만기 위험은 그대로입니다."],
  ["shift","금리가 더 높더라도 단기 대출을 장기 고정금리로 바꿔 만기를 늘린다.",[2,4,1,1,2],"이자율은 높아졌지만 당장 갚아야 할 돈이 줄었습니다.","돈이 끊길 위험은 크게 줄었고 이자 부담은 늘었습니다."]],
  c:"이 단계는 실제 사례가 아닌 가정 수치로 피셔 방정식(실질금리 ≈ 명목금리 − 물가상승률)을 적용해 보는 판단 연습입니다.",
  k:["실질대출금리(피셔 방정식)","만기 불일치"]},
 {t:"4단계 · 수요 변화",q:"기름값이 오르자 소비자가 연비를 따지기 시작했습니다. 우리 라인업은 SUV 중심입니다.",g:"연비 중심으로 바뀐 수요를 놓치지 않는다",o:[
  ["safe","기존 SUV를 계속 팔며 할인으로 재고를 줄이고 신규 투자는 미룬다.",[3,3,1,1,1],"재고는 줄었지만 이익률이 떨어졌습니다.","단기 판매는 유지했고 수요 변화는 따라가지 못했습니다."],
  ["bold","소형 고연비 차를 2년 안에 내기 위해 대규모 개발비를 투입한다.",[2,0,2,2,4],"개발비 부담이 컸고 출시까지 판매 공백이 생겼습니다.","늦게라도 새 수요를 잡을 수 있습니다. 그사이 재무가 버텨야 합니다."],
  ["share","연비 좋은 다른 회사 차를 들여와 우리 딜러망에서 판다.",[4,2,1,2,1],"딜러는 팔 차가 생겼지만 이익은 공급한 회사가 더 가져갔습니다.","수요를 빠르게 잡았지만 우리 기술은 늘지 않았습니다."],
  ["lean","SUV를 경량화하고 엔진을 조정해 연비를 10%쯤 개선한다.",[3,3,1,1,2],"적은 비용으로 연비가 조금 좋아졌습니다.","일부 고객은 잡았습니다. 소형차로 옮겨 가는 고객은 잡지 못했습니다."],
  ["shift","해외 소형차 업체와 합작해 플랫폼을 공동 개발한다.",[2,2,2,1,3],"개발비는 나눴지만 의사결정이 느려지고 기술 통제권 일부를 내줬습니다.","새 수요를 잡을 길이 열렸습니다. 시점은 합작 진행 속도에 달렸습니다."]],
  c:"석유파동 뒤 연비 좋은 일본 소형차가 미국 시장에서 점유율을 크게 늘렸다는 흐름이 널리 알려져 있습니다(구체적 수치는 출처 확인 필요).",
  k:["구조조정","인플레이션율"]},
 {t:"5단계 · 2차 파동 전",q:"1차 파동이 지나고 경기가 회복됐습니다. 몇 년 뒤 2차 석유파동이 옵니다. 회복기에 무엇을 해 둡니까?",g:"다음 유가 충격 때 피해를 줄인다",o:[
  ["safe","회복기 이익으로 부채를 갚아 부채비율을 크게 낮춘다.",[2,4,1,1,2],"재무 체력이 좋아졌지만 설비와 제품은 그대로입니다.","버티는 힘은 커졌고, 유가에 따라 원가가 흔들리는 구조는 같습니다."],
  ["bold","회복세를 타고 차입으로 생산능력을 크게 늘린다.",[3,0,1,2,3],"판매가 늘고 점유율이 올랐지만 부채가 다시 커졌습니다.","2차 충격이 오면 늘어난 설비와 빚이 함께 부담이 됩니다."],
  ["share","협력사와 함께 에너지 절감 설비 투자 기금을 만든다.",[1,2,3,3,1],"협력사 원가가 내려가 공급망 전체가 단단해졌습니다.","다음 충격 때 협력사 연쇄 부도 위험이 줄어듭니다."],
  ["lean","에너지를 많이 쓰는 공정만 골라 효율 설비로 바꾼다.",[3,3,1,1,2],"투자비가 적고 원가가 바로 조금 내려갔습니다.","피해를 일부 줄입니다. 제품 구성은 그대로입니다."],
  ["shift","차종 구성을 소형·중형으로 다양화하는 장기 계획을 세운다.",[1,2,2,1,4],"몇 년의 투자가 필요하고 지금 이익은 줄었습니다.","유가 충격 때 수요가 옮겨 가도 받아 낼 수 있게 됩니다."]],
  c:"2차 석유파동 때인 1980년 한국 성장률은 −5.2%, 물가는 30%였습니다. 1차 이후 체질을 개선하지 않고 중화학공업을 확대해 피해가 더 컸습니다. 1차 때는 산업 구조가 덜 성숙해 성장률이 1973년 12.3%에서 1974년 7.4%로 떨어지는 데 그쳤습니다.",
  k:["경착륙","구조조정"]}
]},
{id:"imf",grp:"loss",src:"set",title:"외환위기형 금융 충격",cause:"금융·환율",era:"1997",
 desc:"동종 대기업이 부도 위기에 몰리고 금융권이 단기 자금을 한꺼번에 회수합니다. 환율은 두 배 넘게 뛰고 금리는 30%에 이릅니다.",
 w:[25,35,10,15,15],steps:[
 {t:"1단계 · 자금 회수",q:"재계 상위 완성차 그룹이 부도유예협약 대상이 됐습니다. 종금사들이 우리에게서도 단기 자금을 회수하기 시작했습니다. 우리는 단기 차입 비중이 높고 달러 부채도 있습니다.",g:"자금 회수 속에서 부도를 피한다",o:[
  ["safe","비핵심 자산을 바로 매각하고 모든 투자를 멈춰 현금을 모은다.",[3,4,1,1,0],"현금은 늘었지만 급하게 팔아 자산 가격을 제대로 받지 못했습니다.","당장의 부도 위험은 줄었습니다."],
  ["bold","금리가 높아도 지금 끌어올 수 있는 장기 자금을 최대한 확보해 둔다.",[4,2,1,1,2],"이자 부담이 크게 늘었지만 회수에 대응할 현금이 생겼습니다.","부도는 피했습니다. 비싼 이자가 몇 년 동안 이익을 깎습니다."],
  ["share","주거래은행·종금사를 찾아가 회수 속도를 늦춰 달라고 요청하고 자구 계획을 낸다.",[2,3,1,3,1],"일부 금융사는 응했지만 다른 곳은 회수를 계속했습니다.","부도 위험을 일부 줄였습니다. 결과는 협상에 달려 있습니다."],
  ["lean","만기가 가까운 차입부터 차례로 갚고, 나머지는 연장을 시도한다.",[3,3,1,1,1],"당장의 만기는 넘겼지만 다음 만기 때 같은 문제가 반복됩니다.","시간을 벌었고 근본 문제는 남았습니다."],
  ["shift","빚 대신 자본을 늘리기 위해 지분 일부를 외국 자본에 매각하는 협상을 시작한다.",[2,3,1,1,3],"경영권 일부를 내줘야 하지만 빚 대신 자본이 들어옵니다.","성사되면 부도 위험이 크게 줄지만 협상에 시간이 걸립니다."]],
  c:"기아그룹(재계 8위)은 1997년 7월 15일 부도유예협약 대상이 됐습니다. 원인은 내수 침체, 노사 불안, 그리고 종금사 등 금융권의 집중적인 자금 회수였습니다. 1997년 상장사 평균 부채비율은 451.2%였습니다.",
  k:["만기 불일치","자기자본 대비 부채비율"]},
 {t:"2단계 · 환율 폭등",q:"원/달러 환율이 800원대에서 1,962원까지 올랐습니다. 수출 비중 60%인 우리는 해외 가격 경쟁력이 커졌지만, 달러 부채를 원화로 환산한 금액은 두 배 넘게 불었습니다.",g:"환율 폭등 속에서 달러 부채 부담을 줄인다",o:[
  ["safe","달러 부채를 원화 대출로 바로 바꿔 환율이 더 오를 위험을 막는다.",[3,3,1,1,1],"환율 위험은 사라졌지만 가장 높은 환율에서 손실이 확정됐고 원화 금리도 높습니다.","추가 손실은 막았고 부채 부담은 줄지 않았습니다."],
  ["bold","환율 이득을 모두 해외 가격 인하에 써서 점유율을 크게 늘린다.",[3,1,1,2,3],"해외 판매가 급증했지만 대당 이익은 크지 않았습니다.","달러 수입은 늘었지만 부채를 줄일 여유는 작았습니다."],
  ["share","수입 원자재 값이 오른 협력사 단가를 일부 올려 주고, 수출 물량을 함께 늘린다.",[2,2,2,3,1],"협력사가 버틸 수 있게 됐지만 우리 원가가 올랐습니다.","부채 부담은 천천히 줄었고 생산 차질은 없었습니다."],
  ["lean","해외 판매 가격은 일부만 낮추고, 들어오는 달러로 달러 부채를 바로 갚는다.",[3,4,1,1,1],"달러로 벌어 달러로 갚아 환율 손실이 줄었습니다.","부채 부담이 가장 빨리 줄었습니다."],
  ["shift","해외 판매법인을 세워 현지 통화로 벌고 쓰는 구조를 만든다.",[1,2,2,1,4],"설립 비용이 들고 효과는 몇 년 뒤에 나타납니다.","지금의 부채 부담에는 효과가 작습니다. 다음 환율 충격에 덜 흔들립니다."]],
  c:"원/달러 환율은 1997년 12월 23일 1,962원을 기록했습니다(그 전에는 600~800원대). 당시 단기외채 비율은 700%를 넘었고, 외환보유액 204억 달러 가운데 실제로 쓸 수 있는 돈은 84억 달러였습니다.",
  k:["통화 불일치의 대차대조표 효과","디폴트"]},
 {t:"3단계 · 협력사 연쇄 부도",q:"시장 금리가 30%까지 올라 협력사들이 어음을 현금으로 바꾸지 못하고 있습니다. 결제가 늦어지면 줄도산이 납니다. 우리 현금도 넉넉하지 않습니다.",g:"협력사 연쇄 부도로 생산이 멈추는 것을 막는다",o:[
  ["safe","우리 유동성을 먼저 지키기 위해 협력사 결제 조건을 기존대로 유지한다.",[2,4,1,1,1],"우리 현금은 지켰지만 소규모 협력사 몇 곳이 부도났습니다.","해당 부품 공급이 끊겨 일부 라인이 멈췄습니다."],
  ["bold","부도 위기에 놓인 핵심 협력사를 싼값에 인수해 직접 운영한다.",[3,1,3,1,2],"공급은 안정됐지만 인수 자금과 협력사의 부실을 함께 안게 됐습니다.","생산 중단은 막았고 재무 부담은 늘었습니다."],
  ["share","모든 협력사의 결제를 현금으로 앞당긴다.",[3,0,3,4,0],"협력사는 모두 살아남았지만 우리 현금이 크게 줄었습니다.","생산 중단은 막았습니다. 우리 자금 사정은 위험해졌습니다."],
  ["lean","대체가 어려운 협력사만 골라 조기 결제하고 나머지는 기존 조건을 유지한다.",[3,3,2,1,1],"현금은 적게 썼지만 지원받지 못한 협력사의 반발이 있었습니다.","핵심 부품 공급은 지켰고 일부 협력사는 부도났습니다."],
  ["shift","은행과 함께 협력사 어음을 우리 신용으로 할인해 주는 상생 금융 상품을 만든다.",[1,2,3,2,2],"만드는 데 시간이 걸렸지만 우리 현금은 크게 쓰지 않았습니다.","시간이 지나며 연쇄 부도가 줄었습니다. 처음 몇 주는 공백이 있었습니다."]],
  c:"외환위기 때 실세금리는 30%에 이르렀지만 법정 최고이율 25%에 막혀 자금 시장이 마비됐고, 실업자는 150만 명이 됐습니다.",
  k:["신용비용","우발 부채"]},
 {t:"4단계 · 채권단 조건",q:"채권단이 빚 상환을 미뤄 주는 대신 구조조정과 인력 30% 감축을 조건으로 내걸었습니다.",g:"지원을 받아 살아남되 회사의 미래 역량을 지킨다",o:[
  ["safe","조건을 모두 받아들이고 요구대로 인력을 30% 줄인다.",[3,4,1,0,1],"지원이 바로 들어왔지만 숙련 인력과 개발 인력도 함께 줄었습니다.","살아남았지만 회복기의 생산·개발 역량이 약해졌습니다."],
  ["bold","조건을 거절하고 외국 완성차와 제휴해 새 자금을 찾는다.",[3,1,1,2,3],"협상 기간 내내 자금 압박이 계속됐습니다.","성사되면 자율성과 기술 협력을 얻습니다. 실패하면 부도입니다."],
  ["share","조건을 받아들이되 인력 조정은 노조와 협의해 희망퇴직·순환휴직부터 쓴다.",[2,3,1,3,1],"감원 속도는 느렸지만 파업 없이 진행됐습니다.","채권단은 속도에 불만이 있었지만 핵심 인력은 지켰습니다."],
  ["lean","조건을 받아들이고 수익이 나지 않는 차종과 공장 한 곳을 정리한다.",[3,3,1,1,2],"비용이 크게 줄었지만 그 공장이 있던 지역의 고용이 무너졌습니다.","살아남았고 구조는 가벼워졌습니다. 생산능력은 줄었습니다."],
  ["shift","조건 가운데 연구개발 인력 감축만 빼 달라고 협상하고, 대신 임원 수를 절반으로 줄인다.",[2,2,1,2,3],"협상에 시간이 걸렸지만 개발 인력은 남았습니다.","미래 역량은 지켰지만 지원 시점이 늦어졌습니다."]],
  c:"부도유예협약은 기업의 부실을 금융기관의 부실로 옮겼다는 평가를 받습니다.",
  k:["이행조건","구제금융의 도덕적 해이","좀비"]},
 {t:"5단계 · 위기 이후",q:"최악의 시기가 지났습니다. 같은 일을 다시 겪지 않으려면 무엇을 바꿉니까?",g:"같은 금융 충격이 다시 와도 버틸 구조를 만든다",o:[
  ["safe","부채비율 목표를 공개하고 이익은 모두 빚 갚는 데 쓴다.",[2,4,1,1,2],"부채비율이 빠르게 내려갔지만 투자가 줄었습니다.","버틸 구조는 생겼고 성장 속도는 느려졌습니다."],
  ["bold","원화 약세로 수출이 잘되는 지금 차입으로 설비를 크게 늘린다.",[3,1,1,2,3],"판매와 점유율이 늘었지만 부채비율이 다시 올랐습니다.","성장은 했지만 같은 충격에 다시 취약해졌습니다."],
  ["share","노사·협력사와 함께 위기 때 임금·단가·근무시간을 어떻게 나눌지 미리 합의해 둔다.",[2,2,2,3,1],"합의에 시간이 걸렸습니다. 다음 위기 때 협상 시간이 줄어듭니다.","재무 구조는 그대로지만 위기 대응 속도가 빨라집니다."],
  ["lean","외화 부채 헤지 원칙과 단기 차입 비중 상한을 정한다.",[3,3,1,1,2],"비용이 조금 늘었지만 환율·만기 위험이 줄었습니다.","적은 비용으로 가장 큰 위험 두 가지를 막았습니다."],
  ["shift","수출 지역을 넓히고 판매 구조를 개편해 한 시장 의존을 줄인다.",[1,2,2,1,4],"몇 년의 투자가 필요합니다.","당장의 재무 효과는 작습니다. 한 나라 경기에 덜 흔들리게 됩니다."]],

 {t:"3단계 · 원자재 급등",q:"알루미늄·니켈 같은 원자재와 유럽 에너지 가격이 급등했습니다.",g:"원자재·에너지 가격 급등으로 늘어난 원가를 관리한다",o:[

  ["bold","가격이 더 오를 것으로 보고 1년분 원자재를 지금 사 둔다.",[3,0,3,1,2],"가격이 더 오르면 큰 이득이고, 내리면 큰 손실입니다.","원가가 고정됐지만 예측에 따라 결과가 크게 갈립니다."],

  ["lean","원자재 장기 계약과 가격 헤지를 늘린다.",[3,3,2,1,1],"헤지 비용이 들었지만 원가 변동이 작아졌습니다.","원가를 예측 가능하게 만들었습니다."],
  ["shift","알루미늄·니켈 사용량을 줄이는 소재 대체 연구를 시작한다.",[1,2,2,1,4],"연구비가 들고 성과는 몇 년 뒤에 나옵니다.","지금의 원가에는 효과가 없습니다. 다음 충격 때 원가가 덜 흔들립니다."]],
  c:"S&P는 우크라이나 전쟁 영향으로 2022년과 2023년 세계 자동차 생산 전망을 각각 260만 대씩 낮췄습니다.",
  k:["인플레이션율","잠재 비용"]},
 {t:"4단계 · 고객 대기",q:"유럽 딜러 재고가 바닥나 계약 고객이 몇 달째 차를 기다리고 있습니다.",g:"차를 기다리는 고객의 이탈을 막는다",o:[
  ["safe","확정된 인도 일정이 나올 때까지 공식 안내를 미루고 개별 문의에만 답한다.",[2,3,1,1,2],"잘못된 안내로 생길 보상 위험은 없었지만, 불안한 고객 일부가 계약을 취소했습니다.","이탈을 일부 막지 못했습니다."],
  ["bold","웃돈을 내면 먼저 인도받는 '우선 인도권'을 판다.",[3,4,1,0,1],"추가 수익이 생겼지만 웃돈을 내지 않은 고객의 불만이 커졌습니다.","급한 고객은 남았고 나머지 고객의 이탈은 늘었습니다."],
  ["share","예상 인도 시점을 공개하고 위약금 없이 취소하거나 사양을 바꿀 수 있게 한다.",[3,1,2,4,1],"취소가 조금 늘었지만 남은 고객의 신뢰가 높아졌습니다.","전체 이탈은 줄었고 취소 비용은 회사가 졌습니다."],
  ["lean","재고가 있는 다른 사양으로 바꾸면 할인해 준다.",[4,2,1,2,1],"재고가 빠르게 소진되고 대기 고객이 줄었습니다.","이탈을 효과적으로 줄였고 이익률은 조금 낮아졌습니다."],
  ["shift","생산·배송 현황을 고객이 온라인으로 바로 볼 수 있는 시스템을 만든다.",[1,2,1,2,4],"구축에 몇 달이 걸렸습니다.","지금 고객에게는 늦었지만 다음 공급 차질 때 이탈을 줄일 수 있습니다."]],
  c:"실제 사례 연결 없음. 위 사실을 가상기업에 옮겨 이해관계자 판단을 연습하는 단계입니다.",
  k:["세계 경제의 파편화"]},
 {t:"5단계 · 재설계",q:"전쟁은 길어질 것으로 보입니다. 공급망을 어떻게 다시 짭니까?",g:"전쟁이 길어져도 생산이 끊기지 않는 공급망을 만든다",o:[

  ["shift","1~3차 협력사 생산지를 지도로 그리고, 설계 단계부터 지역 분산을 기준에 넣는다.",[1,2,3,1,3],"시스템을 만드는 데 시간이 걸렸습니다.","당장의 효과는 작습니다. 신차부터는 처음부터 분산된 공급망을 갖습니다."]],
  c:"실제 사례 연결 없음. 하네스 사태가 보여 준 '한 지역 집중'의 위험을 가상기업의 구조 개선에 적용하는 단계입니다.",

{id:"tariff",grp:"loss",src:"add",title:"보호무역 · 관세 장벽",cause:"정치·통상",era:"2022~2025",
 desc:"주요 수출 시장이 수입차에 25% 관세를 매기고, 현지에서 만든 차에만 보조금을 줍니다. 수출 60% 기업의 판매 구조가 흔들립니다.",
 w:[20,20,15,20,25],steps:[
 {t:"1단계 · 관세 발표",q:"수출 비중이 큰 시장 한 곳이 수입차에 25% 관세를 매기기로 했습니다(2025년 미국 사례를 가상기업에 옮긴 가정).",g:"관세 충격에도 그 시장의 판매와 이익을 지킨다",o:[
  ["safe","관세만큼 가격을 올려 대당 이익을 지킨다.",[3,4,1,0,1],"이익률은 지켰지만 그 시장 판매가 크게 줄었습니다.","이익은 지켰고 판매는 놓쳤습니다."],
  ["bold","관세를 전부 회사가 내고, 경쟁사가 가격을 올리는 사이 점유율을 늘린다.",[3,0,1,2,3],"점유율은 올랐지만 대당 손실이 커졌습니다.","판매는 지켰고 이익은 크게 줄었습니다."],
  ["share","관세 부담을 회사·딜러·소비자가 나누는 가격 정책을 딜러와 협상한다.",[2,2,1,3,2],"딜러 이익도 줄었지만 판매 감소는 작았습니다.","두 목표를 절반씩 지켰습니다."],
  ["lean","시나리오별 손익을 계산해 관세를 내도 이익이 남는 차종만 그 시장에 보낸다.",[4,3,1,1,1],"수출 물량은 줄었지만 보낸 차는 이익이 남았습니다.","이익은 지켰고 판매 차종이 줄었습니다."],
  ["shift","관세를 내도 이익이 남는 고급 트림을 그 시장 전용으로 개발한다.",[2,2,1,1,4],"개발에 1년이 걸리고 비용이 듭니다.","당장의 판매에는 효과가 없습니다. 이후 그 시장의 수익 구조가 바뀝니다."]],
  c:"미국은 2025년 4월부터 수입 자동차에 25% 관세를 매겼고, 이후 한미 협상으로 한국산 자동차 관세를 15%로 낮추기로 했습니다(세부 일정은 출처 확인 필요).",
  k:["탈세계화","세계 경제의 파편화"]},
 {t:"2단계 · 발효 전",q:"관세 발효까지 두 달이 남았습니다.",g:"관세 발효 전 남은 두 달을 최대한 활용한다",o:[
  ["safe","무리하지 않고 평소 물량을 유지하며 현금을 아낀다.",[1,4,1,2,1],"재고 위험은 없었습니다.","관세를 피할 기회를 거의 쓰지 않았습니다."],
  ["bold","최대한 많이 선적해 현지에 6개월분 재고를 쌓는다.",[4,0,2,1,2],"관세는 피했지만 재고 금융 비용과 보관비가 크게 늘었습니다.","관세 절감 효과는 컸고 재고가 다 팔릴지는 수요에 달렸습니다."],
  ["share","딜러가 감당할 수 있는 만큼만 미리 받아 두도록 딜러와 물량을 협의한다.",[3,2,1,3,1],"딜러 부담이 커지지 않았습니다.","관세 절감 효과는 중간 정도였습니다."],
  ["lean","재고 금융 비용보다 관세 절감액이 더 큰 양까지만 선적한다.",[3,3,2,1,1],"계산한 만큼 이익이 남았습니다.","두 달을 비용 대비 효율적으로 썼습니다."],
  ["shift","두 달 동안 다른 FTA 시장의 판매 준비에 인력을 돌린다.",[2,2,1,1,4],"당장의 관세 절감은 없었습니다.","관세 시장 의존을 줄이는 준비를 앞당겼습니다."]],
  c:"실제 사례 연결 없음. 관세 발효 전 선적 판단에 재고 비용을 계산해 넣는 연습 단계입니다.",
  k:["자금조달비용"]},
 {t:"3단계 · 현지 생산",q:"그 시장은 현지에서 조립한 차에만 보조금을 줍니다. 우리는 연 40만 대 규모이고 부채비율이 높습니다.",g:"현지 생산 압력에 맞추되 재무 위험을 키우지 않는다",o:[
  ["safe","그 시장 판매 비중을 줄이고 다른 시장 판매를 늘린다.",[2,4,1,1,1],"투자 부담은 없었지만 큰 시장에서 입지가 줄었습니다.","재무 위험은 없었고 현지 생산 압력에는 대응하지 않았습니다."],
  ["bold","현지에 대형 공장을 단독으로 짓는다.",[3,0,2,2,3],"보조금 대상이 됐지만 투자비가 부채비율을 크게 높였습니다.","현지 생산 목표는 달성했고 재무 위험은 커졌습니다."],
  ["share","현지 기업과 합작 공장을 세워 투자와 위험을 나눈다.",[2,2,2,3,2],"투자 부담은 절반이 됐지만 이익과 의사결정도 나눠야 합니다.","두 목표를 고르게 달성했습니다."],
  ["lean","현지 업체에 위탁 조립을 맡겨 큰 투자 없이 현지 조립 요건을 맞춘다.",[3,3,2,1,1],"투자는 적었지만 대당 위탁 비용이 들고 품질 관리가 어려워졌습니다.","재무 위험 없이 요건을 맞췄습니다."],
  ["shift","부품 형태로 수출해 현지에서 조립하는 방식으로 시작하고, 판매가 확인되면 투자를 늘린다.",[2,2,2,1,3],"초기 생산량은 적었지만 단계별로 판단할 수 있게 됐습니다.","목표에 천천히 다가갔습니다."]],
  c:"미국 인플레이션 감축법(IRA, 2022년 8월)은 북미에서 최종 조립한 전기차에만 보조금을 주도록 해 현지 생산 압력을 키운 대표적인 사례입니다.",
  k:["자금조달비용","세계 경제의 파편화"]},
 {t:"4단계 · 국내 협력사",q:"수출이 줄면 국내 협력사 물량과 공장 지역의 일자리가 줄어듭니다.",g:"수출 감소가 협력사와 지역 고용으로 번지는 것을 줄인다",o:[
  ["safe","줄어든 물량만큼 협력사 발주를 줄이고 계약 조건은 그대로 둔다.",[3,3,1,1,1],"우리 비용은 늘지 않았지만 협력사 매출이 줄었습니다.","충격이 협력사로 그대로 전달됐습니다."],
  ["bold","협력사와 함께 현지에 동반 진출해 현지 공장에 부품을 대게 한다.",[2,1,3,2,2],"협력사의 해외 매출이 생겼지만 투자 부담을 함께 졌습니다.","국내 고용 감소는 일부 남았고 협력사 매출은 지켰습니다."],
  ["share","정부 통상 피해 지원을 협력사가 받을 수 있도록 서류 작성과 컨설팅을 지원한다.",[2,2,2,4,1],"협력사 다수가 지원을 받았습니다.","충격을 크게 줄였습니다. 지원이 끝나면 다시 문제가 될 수 있습니다."],
  ["lean","납품 단가를 조금 낮추는 대신 다른 시장용 물량을 협력사에 더 배정한다.",[3,3,1,2,1],"협력사 매출은 비슷하게 유지됐지만 이익률은 줄었습니다.","고용은 지켰고 협력사 체력은 약해졌습니다."],
  ["shift","협력사가 다른 완성차와 다른 산업에도 납품할 수 있도록 기술을 지원한다.",[1,2,2,2,3],"효과가 나오기까지 시간이 걸립니다.","지금의 충격은 그대로입니다. 협력사가 우리 판매에 덜 의존하게 됩니다."]],
  c:"실제 사례 연결 없음. 기업의 대응이 협력사·고용·지역경제로 이어지는 양방향 파급을 따져 보는 단계입니다.",
  k:["블루칼라 노동자"]},
 {t:"5단계 · 시장 재편",q:"통상 환경이 계속 바뀔 것으로 보입니다. 장기적으로 무엇을 합니까?",g:"한 나라의 통상 정책에 덜 흔들리는 판매 구조를 만든다",o:[
  ["safe","협상 결과가 나올 때까지 큰 결정을 미루고 현금을 모은다.",[1,4,1,2,1],"재무는 안정적이었습니다.","판매 구조는 바뀌지 않았습니다."],
  ["bold","관세가 낮아질 것으로 보고 그 시장 판매망을 오히려 늘린다.",[3,1,1,2,2],"관세가 내려가면 큰 이득이고, 유지되면 손실이 커집니다.","한 시장 의존이 더 커졌습니다."],
  ["share","업계 공동으로 FTA 확대와 통상 협상에서 자동차 분야를 챙겨 달라고 정부에 제안한다.",[2,2,2,3,2],"정부 정책에 업계 의견이 반영되기 시작했습니다.","효과는 정부 협상 결과에 달려 있습니다."],
  ["lean","관세가 없는 FTA 시장 가운데 이익률이 높은 곳으로 물량을 옮긴다.",[3,3,1,1,2],"이익률을 지키며 판매 지역이 넓어졌습니다.","목표에 빠르게 다가갔습니다."],
  ["shift","시장별로 차종을 현지화해 어느 시장에서든 물량을 옮겨 팔 수 있게 만든다.",[1,2,2,1,4],"차종 개발 비용이 늘었습니다.","가장 근본적으로 목표를 달성하지만 시간이 오래 걸립니다."]],
  c:"실제 사례 연결 없음. 수출 지역(유럽·중남미·중동) 분산이라는 가상기업 설정을 활용하는 판단 단계입니다.",
  k:["세계 경제의 파편화","탈세계화"]}
]},
{id:"covid",grp:"loss",src:"add",title:"팬데믹 셧다운",cause:"보건·수요",era:"2020",
 desc:"중국 봉쇄로 부품이 끊기고, 이어서 수출 시장이 봉쇄돼 판매가 반토막 납니다. 그런데 수요는 예상보다 빨리 돌아옵니다.",
 w:[25,25,20,20,10],steps:[
 {t:"1단계 · 부품 단절",q:"중국 봉쇄로 현지 협력사의 와이어링 하네스 공급이 끊겼습니다.",g:"부품 공급 중단으로 멈추는 기간을 줄인다",o:[

  ["bold","항공 운송과 높은 단가를 감수하고 동남아·국내 업체에 대체 생산을 급히 맡긴다.",[4,0,3,1,1],"휴업 기간이 크게 줄었지만 원가가 많이 올랐습니다.","멈추는 기간을 가장 많이 줄였습니다."],
  ["share","휴업 일정을 미리 알리고, 협력사와 노동자에게 휴업 수당과 결제를 보장한다.",[2,2,1,4,1],"휴업은 했지만 협력사와 노동자의 피해가 줄었습니다.","멈추는 기간은 그대로였고, 재가동은 빨랐습니다."],
  ["lean","남은 하네스를 판매가 잘되는 차종에 몰아 쓴다.",[4,3,1,1,1],"인기 차종은 생산이 이어졌습니다.","일부 라인만 멈췄습니다."],
  ["shift","중국 밖에 두 번째 하네스 공급처를 세우는 투자를 결정한다.",[1,2,4,1,2],"투자비가 들고 가동까지 몇 달이 걸립니다.","이번 중단은 줄이지 못했습니다. 다음 봉쇄 때는 멈추지 않을 수 있습니다."]],
  c:"2020년 2월 현대차는 중국산 와이어링 하네스 공급 차질로 국내 공장을 휴업했습니다(일정은 출처 확인 필요).",
  k:["세계 경제의 파편화"]},
 {t:"2단계 · 판매 급감",q:"유럽·중남미가 봉쇄돼 수출이 급감했습니다. 매출이 절반으로 줄었습니다(가정).",g:"매출이 반토막 난 동안 버틸 현금을 확보한다",o:[

  ["bold","경쟁사가 움츠린 사이 온라인 판매와 마케팅에 오히려 투자한다.",[2,0,1,2,4],"현금이 줄었지만 브랜드 노출이 크게 늘었습니다.","현금 목표와는 반대로 갔습니다. 회복기 판매에 유리합니다."],
  ["share","협력사·딜러와 결제 조건을 함께 조정해 서로의 현금 흐름을 맞춘다.",[2,2,2,3,1],"모두가 조금씩 부담을 나눴습니다.","현금을 어느 정도 확보했고 협력 관계도 유지했습니다."],
  ["lean","감산하고 재고 차를 할인 판매해 현금으로 바꾼다.",[3,3,1,1,1],"현금이 빠르게 들어왔지만 이익률이 떨어졌습니다.","현금을 빠르게 확보했습니다."],
  ["shift","이익이 적던 수출 시장 한 곳을 이번에 정리한다.",[2,3,1,1,3],"철수 비용이 들었지만 앞으로 고정비가 줄어듭니다.","당장의 현금 효과는 작았습니다. 구조가 가벼워졌습니다."]],
  c:"실제 사례 연결 없음. 매출 급감 때 유동성부터 확보하는 판단을 연습하는 단계입니다.",

 {t:"3단계 · 정부 지원 조건",q:"정부가 '고용을 유지하는 조건'으로 저금리 대출을 제안했습니다.",g:"싼 자금을 확보하면서 구조를 바꿀 여지도 남긴다",o:[

  ["bold","조건을 거절하고 인력을 줄여 회복기 전에 몸집을 가볍게 한다.",[3,2,1,0,3],"비싼 자금을 써야 했지만 고정비가 크게 줄었습니다.","구조는 바꿨고 싼 자금은 놓쳤습니다."],
  ["share","조건을 받아들이고 순환휴직으로 고용을 나눈다.",[3,3,1,4,0],"고용은 유지됐고 노사 관계가 좋아졌습니다.","싼 자금은 확보했고 구조 변화는 미뤄졌습니다."],
  ["lean","필요한 만큼만 대출을 받고, 조건 범위 안에서 신규 채용을 멈춘다.",[3,3,1,1,2],"이자 부담이 작고 자연 감소로 인력이 조금씩 줄었습니다.","두 목표를 적당히 맞췄습니다."],
  ["shift","대출을 받아 남는 인력을 전동화·소프트웨어 직무로 재교육한다.",[1,3,1,2,3],"교육비가 들었지만 인력 구성이 바뀌기 시작했습니다.","고용 조건을 지키면서 구조를 바꾸는 길을 찾았습니다. 효과는 느립니다."]],
  c:"실제 사례 연결 없음. 정부 지원에 붙는 이행조건과 도덕적 해이를 따져 보는 단계입니다.",

 {t:"4단계 · 내수 부양책",q:"정부가 자동차 개별소비세를 크게 낮췄습니다. 내수 판매가 살아날 조짐입니다.",g:"세금 인하로 살아난 내수 수요를 판매로 연결한다",o:[

  ["bold","수출용 생산 라인 일부를 내수용으로 바꿔 대량 출고한다.",[4,1,1,2,2],"라인 전환 비용이 들었지만 판매가 크게 늘었습니다.","수요를 가장 많이 가져왔습니다. 수출이 회복되면 다시 바꿔야 합니다."],
  ["share","세금 인하분이 고객에게 그대로 가도록 가격을 공개하고 딜러 판매 수당을 올린다.",[2,2,1,4,1],"고객 신뢰가 높아졌고 딜러 판매 의욕이 커졌습니다.","판매가 꾸준히 늘었습니다."],
  ["lean","세금 인하 효과를 감안해 일부 트림 가격을 올려 이익률을 높인다.",[3,4,1,0,1],"이익률은 올랐지만 고객이 체감하는 할인은 줄었습니다.","판매량보다 이익을 더 가져왔습니다."],
  ["shift","비대면 온라인 판매 채널을 만든다.",[2,2,1,1,4],"구축 비용과 딜러 반발이 있었습니다.","지금의 판매 효과는 중간 정도였고 판매 방식이 바뀌었습니다."]],
  c:"한국 정부는 2020년 3월부터 승용차 개별소비세를 70% 낮췄습니다(기간과 이후 인하 폭은 출처 확인 필요).",
  k:["양적완화","절약의 역설"]},
 {t:"5단계 · 빠른 반등",q:"초저금리와 백신 기대로 차 수요가 예상보다 빨리 살아나고 있습니다. 우리는 봉쇄 때 부품 주문을 줄여 둔 상태입니다.",g:"예상보다 빠른 수요 회복에 맞춰 생산을 늘린다",o:[
  ["safe","회복이 확실해질 때까지 부품 주문을 미룬다.",[1,4,1,1,2],"재고 위험은 없었지만 부품 확보가 늦어졌습니다.","회복기 생산 확대가 늦어졌습니다."],
  ["bold","모든 부품을 대량 주문해 재고를 다시 쌓는다.",[3,0,4,1,2],"공급은 확보했지만 재고 비용이 커졌습니다.","생산을 가장 빨리 늘렸습니다."],
  ["share","핵심 부품사와 회복 물량을 함께 계획하고 선급금을 일부 준다.",[2,1,3,3,1],"부품사가 생산을 늘릴 여력이 생겼습니다.","생산 확대가 안정적으로 이어졌습니다."],
  ["lean","반도체 등 핵심 부품만 골라 주문을 먼저 늘린다.",[3,3,2,1,1],"비용은 적었고 가장 큰 병목을 막았습니다.","생산을 빠르게 늘렸고 고르지 않은 부품에서 차질이 생겼습니다."],

  k:["양적완화","절약의 역설"]}

{id:"rate",grp:"loss",src:"add",title:"고금리 · 신용 경색",cause:"통화정책·금융",era:"2022",
 desc:"미국이 기준금리를 빠르게 올리고 환율은 1,400원을 넘습니다. 국내 단기 자금 시장까지 얼어붙어 신용등급이 낮은 기업부터 돈줄이 막힙니다.",
 w:[25,35,5,15,20],steps:[
 {t:"1단계 · 금리 급등",q:"미국 중앙은행이 기준금리를 한 번에 0.75%p씩 연달아 올립니다. 신용등급이 낮은 우리는 가산금리가 크게 뛰었고, 회사채 만기가 3개월 뒤입니다.",g:"회사채 만기를 넘기고 조달 비용을 줄인다",o:[
  ["safe","새로 빌리지 않고 가진 현금과 자산 매각으로 만기를 갚는다.",[3,3,1,1,1],"빚은 줄었지만 운영 자금이 얇아졌습니다.","만기는 넘겼습니다. 다음 충격에 쓸 현금이 부족합니다."],
  ["bold","금리가 더 오르기 전에 지금 금리로 장기 회사채를 크게 발행한다.",[4,2,1,1,2],"이자는 높지만 몇 년 치 자금이 확보됐습니다.","만기는 확실히 넘겼고 조달 비용은 높게 고정됐습니다."],
  ["share","주거래은행에 경영 정보를 공개하고 장기 거래를 약속해 대출 한도와 금리를 협상한다.",[2,3,1,3,1],"금리가 조금 내려가고 은행 한도가 생겼습니다.","두 목표를 조금씩 달성했습니다."],
  ["lean","만기 직전까지 시장을 지켜보다가 금리가 가장 낮은 날 발행한다.",[2,3,1,1,2],"금리가 떨어지면 이득이지만 시장이 얼어붙으면 발행 자체가 안 될 수 있습니다.","결과가 시장 상황에 크게 좌우됐습니다."],
  ["shift","공장 부지를 팔고 다시 빌려 쓰는 방식(세일앤리스백)으로 빚 없이 현금을 만든다.",[3,3,1,1,2],"현금은 생겼지만 앞으로 임차료가 나갑니다.","만기는 넘겼고 재무 구조가 바뀌었습니다."]],
  c:"미국 연방준비제도는 2022년 6월부터 11월까지 기준금리를 네 번 연속 0.75%p씩 올렸습니다.",
  k:["가산금리","자금조달비용"]},
 {t:"2단계 · 단기 자금 시장 경색",q:"국내 한 지방정부 보증 채권의 부도 사태로 회사채와 기업어음(CP) 시장이 얼어붙었습니다. 우리 CP 차환이 막혔습니다.",g:"CP 차환이 막힌 상태에서 자금 공백을 메운다",o:[
  ["safe","비핵심 자산을 급히 매각한다.",[4,3,1,1,1],"현금은 생겼지만 제값을 받지 못했습니다.","공백은 메웠고 자산 손실이 생겼습니다."],
  ["bold","금리가 매우 높아도 사모 자금을 끌어와 공백을 메운다.",[4,1,1,1,2],"자금은 바로 들어왔지만 이자 부담이 커졌습니다.","공백을 가장 빨리 메웠습니다."],
  ["share","협력사에 결제를 한 달 미뤄 달라고 요청하고 그 기간 이자를 붙여 준다.",[3,3,1,1,1],"우리 공백은 메웠지만 협력사 자금 사정이 나빠졌습니다.","목표는 달성했고 부담 일부가 협력사로 갔습니다."],

 {t:"1단계 · 칩 부족",q:"반도체가 부족해 경쟁사들이 감산하고 있습니다. 우리가 쓰는 칩도 구하기 어렵습니다.",g:"반도체 부족 속에서 생산을 이어 간다",o:[
  ["safe","원래 칩이 들어올 때까지 감산하고 비용을 줄인다.",[2,4,1,1,1],"손실은 작았지만 생산이 경쟁사처럼 줄었습니다.","생산을 이어 가지 못했습니다."],
  ["bold","현물시장에서 비싼 칩을 대량으로 산다.",[4,0,2,1,2],"생산은 이어졌지만 원가가 크게 올랐습니다.","생산을 이어 갔고 이익률은 낮아졌습니다."],
  ["share","반도체 업체와 장기 계약을 맺고 선급금을 준다.",[2,1,3,3,1],"공급 순위가 올라갔지만 효과가 나오기까지 몇 달이 걸렸습니다.","당장은 감산했고 이후 공급이 안정됐습니다."],
  ["lean","칩이 적게 드는 차종으로 생산을 몰아준다.",[4,3,1,1,1],"비용 없이 생산 대수를 지켰지만 차종 구성이 한쪽으로 쏠렸습니다.","생산을 상당 부분 이어 갔습니다."],
  ["shift","구할 수 있는 다른 칩에 맞게 소프트웨어를 다시 짠다.",[3,1,3,1,2],"개발 인력이 몇 주 동안 이 일에 매달렸습니다.","성공하면 생산을 이어 가고 공급처도 넓어집니다."]],
  c:"테슬라는 대체 칩을 쓰고, 그 칩에 맞게 소프트웨어를 2~3주 만에 다시 썼습니다.",
  k:["세계 경제의 파편화"]},
 {t:"2단계 · 부품 없는 출고",q:"일부 편의 기능용 칩은 여전히 없습니다. 차는 그 기능 없이도 달릴 수 있습니다.",g:"부족한 부품 때문에 판매가 멈추지 않게 한다",o:[
  ["safe","모든 기능이 갖춰진 차만 출고한다.",[1,3,1,3,1],"품질 불만은 없었지만 출고가 늦어졌습니다.","판매가 일부 멈췄습니다."],
  ["bold","기능을 뺀 채 가격 그대로 출고하고 칩이 들어오면 나중에 달아 준다.",[4,3,1,1,1],"판매는 이어졌지만 나중에 장착하는 비용과 일정 관리 부담이 생겼습니다.","판매를 멈추지 않았습니다."],
  ["share","기능을 뺀 차는 할인해 출고하고, 원하는 고객은 완전한 차를 기다릴 수 있게 한다.",[3,2,1,3,1],"할인 비용이 들었지만 고객이 직접 고를 수 있었습니다.","판매 대부분을 이어 갔습니다."],
  ["lean","빼도 되는 기능을 기본 사양에서 아예 없애고 가격을 조금 낮춘다.",[3,3,2,1,1],"칩 사용량이 영구적으로 줄었습니다.","판매를 이어 갔고 상품성은 조금 낮아졌습니다."],
  ["shift","해당 기능을 무선 업데이트로 나중에 켤 수 있게 설계를 바꾼다.",[2,1,2,1,4],"설계 변경에 시간이 걸렸습니다.","당장은 효과가 늦었습니다. 이후 판매 뒤에도 기능을 팔 수 있게 됩니다."]],
  c:"테슬라는 일부 부품 없이 차를 인도하고 일부 기능을 뺐습니다.",
  k:["잠재 비용"]},
 {t:"3단계 · 가격 결정",q:"공급이 부족하고 대기 수요가 많습니다.",g:"대기 수요를 이익으로 바꾸되 고객 이탈을 막는다",o:[
  ["safe","가격을 그대로 둔다.",[1,2,1,3,2],"고객 반응은 좋았지만 오른 원가가 이익을 깎았습니다.","이탈은 없었고 이익은 늘지 않았습니다."],
  ["bold","이미 계약한 고객까지 포함해 가격을 크게 올린다.",[4,4,1,0,1],"이익이 크게 늘었지만 계약 고객 일부가 취소했습니다.","이익은 최대였고 이탈도 생겼습니다."],
  ["share","기존 계약 가격은 지키고 신규 계약 가격만 올린다.",[2,3,1,3,1],"기존 고객 신뢰를 지키면서 이익이 늘었습니다.","두 목표를 고르게 달성했습니다."],
  ["lean","인기 옵션 가격만 골라 올린다.",[3,3,1,2,1],"눈에 덜 띄게 이익이 늘었습니다.","이탈은 적었고 이익은 중간 정도 늘었습니다."],
  ["shift","가격 대신 대기 고객용 구독 서비스로 새 수익원을 만든다.",[2,2,1,1,4],"초기 가입은 적었지만 반복 수익 구조가 생겼습니다.","당장의 이익은 작았습니다. 수익 구조가 바뀌기 시작했습니다."]],
  c:"테슬라는 가격도 올렸습니다. 모델 Y는 18% 인상됐습니다.",
  k:["인플레이션율"]},
 {t:"4단계 · 칩 배분",q:"확보한 칩을 어떤 차에 먼저 씁니까? 수출 60%, 내수 40%입니다.",g:"한정된 칩으로 이익과 시장 기반을 함께 지킨다",o:[
  ["safe","물류 위험이 적은 내수에 먼저 배정한다.",[2,3,1,2,1],"물류 비용은 줄었지만 수출 딜러가 차를 받지 못했습니다.","내수는 지켰고 수출 시장 기반은 약해졌습니다."],
  ["bold","이익이 가장 큰 차종과 시장에 모두 몰아준다.",[4,4,1,0,1],"이익은 최대가 됐지만 다른 시장 딜러가 이탈하기 시작했습니다.","이익은 크게 지켰고 시장 기반은 좁아졌습니다."],
  ["share","모든 시장 딜러에게 판매 비율대로 나눠 준다.",[2,2,1,4,1],"딜러 관계는 지켰지만 어느 시장도 충분히 공급받지 못했습니다.","시장 기반은 지켰고 이익은 중간이었습니다."],
  ["lean","대기 수요가 가장 많은 차종부터 배정한다.",[3,3,2,1,1],"재고 없이 바로 팔려 현금 회전이 빨랐습니다.","이익과 기반을 비교적 고르게 지켰습니다."],
  ["shift","새 시장 진출용 전략 차종에 먼저 배정한다.",[2,2,1,1,4],"당장의 이익은 줄었습니다.","새 시장에서 자리를 먼저 잡았습니다."]],
  c:"실제 사례 연결 없음. 수출 60% 기업의 칩 배분을 기회비용 관점에서 판단하는 단계입니다.",
  k:["잠재 비용"]},
 {t:"5단계 · 이후 구조",q:"위기 속에서 판매를 늘렸습니다. 다음에는 어떻게 대비합니까?",g:"다음 반도체 부족에도 흔들리지 않게 한다",o:[
  ["safe","원래 방식으로 돌아가 원가를 회복한다.",[2,4,1,1,1],"이익률이 회복됐습니다.","다음 부족에 대한 대비는 없습니다."],
  ["bold","반도체를 직접 생산하는 공장 투자에 나선다.",[2,0,3,1,4],"투자비가 매우 컸습니다.","완성되면 공급이 가장 안정되지만 재무 부담이 큽니다."],
  ["share","다른 완성차들과 반도체 공동 구매 조직을 만든다.",[2,2,3,2,1],"협상력이 커졌지만 칩이 부족할 때 배분을 두고 갈등할 수 있습니다.","대비는 생겼습니다. 효과는 협력이 잘되는지에 달렸습니다."],
  ["lean","핵심 칩만 골라 비축한다.",[3,3,2,1,1],"비용은 적었습니다.","가장 큰 위험은 막았습니다."],
  ["shift","반도체 설계 역량을 키우고 칩 회사와 직접 계약한다.",[1,2,3,1,3],"인력 확보와 계약에 시간이 걸렸습니다.","구조적으로 덜 흔들리게 됐습니다."]],
  c:"테슬라의 2021년 인도량은 93만 6,172대로 전년보다 87% 늘었습니다. 같은 해 세계 자동차 판매는 2019년보다 12% 적었습니다.",
  k:["창조적 파괴"]}
]},
{id:"learn",grp:"gain",src:"set",title:"위기 학습 · 대비의 한계",cause:"자연·시장",era:"2011→2021",
 desc:"한 번 크게 다친 뒤 대비한 기업은 다음 위기에서 어떻게 달라질까요? 대비가 통한 순간과 대비로도 막지 못한 순간을 함께 봅니다.",
 w:[15,20,30,15,20],steps:[
 {t:"1단계 · 대지진 이후",q:"대지진으로 생산이 크게 줄었던 경험이 있습니다. 대비하려면 매년 비용이 듭니다.",g:"다음 재해에 대비하되 비용을 감당할 수 있게 한다",o:[

  ["bold","모든 부품을 6개월분 비축한다.",[3,0,4,1,2],"공급 안정성은 최고 수준이 됐지만 비용이 매우 컸습니다.","대비는 확실했고 비용 부담이 컸습니다."],
  ["share","협력사와 비축 비용을 나눠 공동 재고를 운영한다.",[2,2,3,3,1],"우리 부담은 줄었지만 운영 규칙을 맞추는 데 시간이 걸렸습니다.","감당할 만한 비용으로 대비했습니다."],
  ["lean","병목이 되는 부품만 골라 비축한다.",[3,3,2,1,1],"비용 대비 효과가 컸습니다.","핵심 위험을 막았습니다."],
  ["shift","협력사 공급망 정보를 데이터로 관리하는 시스템을 만든다.",[2,2,3,1,2],"구축에 1~2년이 걸렸습니다.","무엇을 대비할지 정확히 알 수 있게 됐습니다."]],
  c:"도요타는 2021년 초 반도체 부족 때 영향을 거의 받지 않았습니다.",
  k:["잠재 비용"]},
 {t:"2단계 · 다시 지진",q:"10년 뒤 다시 지진이 났습니다. 협력사 공장은 내진 보강과 재고 확대를 해 둔 상태입니다.",g:"이번 지진의 생산 피해를 최소로 한다",o:[
  ["safe","피해 범위가 확인될 때까지 공장을 잠시 세운다.",[2,3,1,2,1],"안전은 확인했지만 며칠 생산을 잃었습니다.","피해가 조금 늘었습니다."],
  ["bold","비축분을 모두 풀어 정상 가동하고 증산 준비까지 한다.",[4,1,2,1,2],"생산은 이어졌지만 비축분이 빠르게 줄었습니다.","이번 피해는 최소였고 다음 충격에 대한 여유는 줄었습니다."],
  ["share","피해를 입은 협력사에 인력과 장비를 보내 복구를 돕는다.",[2,1,2,4,1],"협력사 복구가 빨라졌습니다.","우리 생산 피해도 간접적으로 줄었습니다."],
  ["lean","공급망 정보로 영향받은 부품만 찾아 비축분으로 메운다.",[4,3,1,1,1],"필요한 만큼만 비축분을 썼습니다.","피해를 효율적으로 줄였습니다."],
  ["shift","이번 피해 데이터를 모아 대비 체계를 바로 고친다.",[1,2,3,1,3],"당장 생산에는 영향이 없었습니다.","이번 피해는 그대로였고 다음 대비가 정교해졌습니다."]],
  c:"르네사스는 대지진 뒤 내진 보강과 재고 확대를 했고, 2021년 2월 지진 때는 세 공장 가운데 한 곳만 영향을 받았습니다.",
  k:["잠재 비용"]},
 {t:"3단계 · 경쟁사 감산",q:"반도체 부족으로 경쟁사들이 감산하는데, 우리는 비축분 덕분에 생산을 이어 가고 있습니다.",g:"우리만 생산할 수 있는 시기를 이익으로 바꾼다",o:[
  ["safe","비축분을 아끼며 평소 생산량을 유지한다.",[2,3,2,1,1],"부족이 길어져도 버틸 수 있습니다.","이익은 평소 수준이었습니다."],
  ["bold","비축분을 다 써서 최대한 증산한다.",[4,3,0,1,2],"판매가 크게 늘었지만 비축분이 바닥났습니다.","이익은 최대였고 부족이 길어지면 우리도 멈춥니다."],
  ["share","비축 칩 일부를 오랜 협력 관계인 업체와 나눈다.",[2,2,3,3,1],"관계가 단단해졌고 나중에 도움을 받을 여지가 생겼습니다.","이익은 조금 줄었습니다."],
  ["lean","남는 칩을 경쟁사에 비싸게 판다.",[3,4,1,1,1],"현금이 크게 들어왔습니다.","이익은 늘었지만 경쟁사 생산을 도운 셈입니다."],
  ["shift","생산을 유지하면서 바로 재보충 장기 계약을 맺는다.",[2,2,3,1,2],"계약 비용이 들었지만 이후 공급이 안정됐습니다.","이익을 지속적으로 낼 기반을 만들었습니다."]],
  c:"실제 사례 연결 없음. 비축이라는 대비가 공급 부족 때 기회로 바뀌는 조건을 따져 보는 단계입니다.",
  k:["잠재 비용"]},
 {t:"4단계 · 대비의 한계",q:"부족이 길어져 비축분도 바닥이 보입니다. 감산이 불가피합니다.",g:"감산을 피할 수 없을 때 피해를 줄인다",o:[
  ["safe","감산 규모를 크게 잡아 손실을 한 번에 확정하고 비용을 줄인다.",[3,4,1,1,1],"손실 규모가 예측 가능해졌습니다.","피해 범위를 미리 정했습니다. 회복 때 다시 늘리기는 느립니다."],
  ["bold","비싼 칩을 사서라도 생산을 유지한다.",[3,0,2,2,2],"생산은 이어졌지만 대당 손실이 생겼습니다.","판매는 지켰고 손실이 늘었습니다."],
  ["share","감산 규모를 빨리 공개하고 협력사와 휴업 일정을 맞춘다.",[3,2,1,3,1],"협력사가 미리 준비할 수 있었습니다.","공급망 전체의 피해가 줄었습니다."],
  ["lean","수익성 높은 차종만 남기고 나머지를 멈춘다.",[3,3,1,1,2],"이익 감소가 가장 작았습니다.","회사 손실을 효율적으로 줄였습니다."],
  ["shift","감산 기간에 칩 사용을 줄이는 설계 변경을 서두른다.",[1,2,3,1,3],"이번 감산은 그대로였습니다.","다음 부족 때 감산 규모가 작아집니다."]],
  c:"도요타는 2021년 10월 생산을 40% 줄인다고 발표했습니다. 대비를 해도 한계가 있다는 사례입니다.",
  k:["잠재 비용"]},
 {t:"5단계 · 교훈",q:"대비가 통하기도 하고 막히기도 했습니다. 앞으로 어떻게 합니까?",g:"대비 비용과 효과의 균형을 다시 정한다",o:[
  ["safe","결국 한계가 있었으니 비축을 줄여 비용을 아낀다.",[2,4,1,1,1],"비용은 줄었습니다.","대비 효과도 함께 줄었습니다."],
  ["bold","비축을 두 배로 늘린다.",[3,0,4,1,2],"비용이 크게 늘었습니다.","대비는 강해졌고 재무 부담이 커졌습니다."],
  ["share","협력사·정부와 공동 비축 체계를 만든다.",[2,2,3,2,1],"비용을 나눴지만 의사결정이 느려졌습니다.","균형 잡힌 대비를 만들었습니다."],
  ["lean","비축은 지금 수준을 유지하고, 그 비용을 보험료로 보고 효과를 매년 평가한다.",[3,3,2,1,1],"관리 기준이 생겼습니다.","비용과 효과를 숫자로 관리하게 됐습니다."],
  ["shift","비축보다 칩을 바꿔 쓸 수 있는 설계로 방향을 바꾼다.",[1,2,3,1,3],"전환에 몇 년이 걸립니다.","완성되면 비축 비용 자체가 줄어듭니다."]],
  c:"르네사스와 도요타의 2011→2021 경험은 위기 학습이 효과를 내지만 완전한 방어는 아니라는 점을 보여 줍니다.",
  k:["잠재 비용","세계 경제의 파편화"]}
]},
/* ───────── 추가 시나리오 9개 (유형별 균형용) ───────── */
{id:"flood",grp:"loss",src:"add",title:"해외 생산거점 대홍수",cause:"자연재해",era:"2011",
 desc:"전자부품 협력사들이 몰린 해외 공업단지가 대홍수로 잠깁니다. 복구에는 몇 달이 걸리고, 피해는 수출 판매망과 협력사 자금으로 번집니다.",
 w:[25,15,30,15,15],steps:[
 {t:"1단계 · 침수 직후",q:"대홍수로 우리 전자부품 협력사들이 몰려 있는 해외 공업단지가 침수됐습니다. 공장 복구에는 최소 3개월이 걸린다는 예상입니다.",g:"침수로 끊긴 부품 공급을 빨리 메운다",o:[
  ["safe","확보된 재고로 버티는 동안 가동률을 낮추고, 복구 상황을 보며 추가 지출을 정한다.",[2,4,1,1,1],"현금은 지켰지만 생산량이 줄고 협력사 물량도 줄었습니다.","공급 공백이 그대로 남아 몇 주 뒤 일부 라인이 멈췄습니다."],
  ["bold","침수되지 않은 다른 나라 업체에 웃돈을 주고 물량을 통째로 선점한다.",[4,0,3,1,1],"경쟁사보다 먼저 물량을 확보했지만 단가가 크게 올랐습니다.","공급 공백을 가장 빨리 메웠습니다."],
  ["share","협력사 직원과 장비를 국내 공장으로 임시 이전해 생산하도록 공간과 비용을 지원한다.",[2,2,3,3,1],"이전에 몇 주가 걸렸지만 협력사가 무너지지 않았습니다.","공급은 조금 늦게 회복됐고 협력사 관계는 단단해졌습니다."],
  ["lean","침수 부품이 들어가는 옵션을 잠시 빼고 기본 사양 위주로 생산한다.",[4,3,1,1,1],"비용 없이 생산을 이어 갔지만 고급 사양 판매가 줄었습니다.","생산 중단은 막았고 수익성 높은 차 판매는 줄었습니다."],
  ["shift","침수 부품을 다른 업체 부품으로 바꿀 수 있도록 설계 변경과 인증을 서두른다.",[1,2,4,1,2],"인증에 시간이 걸려 당장 효과는 작았습니다.","이번 공백은 오래갔지만 이후 공급처가 두 곳이 됩니다."]],
  c:"2011년 태국 대홍수로 국토의 3분의 1이 잠기고 피해액은 416억 달러에 이르렀습니다. 도요타는 9개국 공장을 일시 중단했습니다.",
  k:["세계 경제의 파편화","잠재 비용"]},
 {t:"2단계 · 수출 지연",q:"부품 부족이 길어지면서 수출 선적 일정이 밀렸습니다. 유럽·중동 딜러들이 납기를 묻고 있습니다.",g:"수출 시장의 딜러와 고객을 잃지 않는다",o:[
  ["safe","확정할 수 있는 물량만 약속하고 나머지는 납기 미정으로 알린다.",[2,3,1,2,1],"지키지 못할 약속은 없었지만 일부 딜러가 다른 브랜드 물량을 늘렸습니다.","딜러 이탈이 일부 생겼습니다."],
  ["bold","내수 물량을 줄여 수출에 먼저 배정한다.",[3,2,1,2,2],"수출 딜러는 지켰지만 내수 대기 고객이 늘었습니다.","수출 시장은 지켰고 내수 불만이 커졌습니다."],
  ["share","딜러에게 재고 보전 지원금을 주고 납기 지연 보상을 함께 설계한다.",[2,1,2,4,2],"비용이 들었지만 딜러 신뢰가 유지됐습니다.","딜러 이탈 없이 공백 기간을 넘겼습니다."],
  ["lean","이익률이 높은 시장부터 순서대로 선적한다.",[3,3,1,1,2],"이익은 지켰지만 뒤로 밀린 시장 딜러의 불만이 컸습니다.","핵심 시장은 지켰고 일부 시장 입지는 약해졌습니다."],
  ["shift","시장별 수요 예측과 선적 계획을 연결하는 판매·생산 통합 계획 체계를 만든다.",[1,2,2,2,3],"체계를 만드는 데 몇 달이 걸렸습니다.","이번 지연에는 늦었지만 다음 공백 때 배분이 빨라집니다."]],
  c:"태국 홍수 당시 혼다는 미국·캐나다 생산을 50% 줄였습니다. 한 지역의 재해가 다른 대륙의 생산과 판매까지 흔들었습니다.",
  k:["세계 경제의 파편화"]},
 {t:"3단계 · 협력사 자금난",q:"협력사들이 침수 피해로 자금난을 호소합니다. 보험 보상은 몇 달 뒤에야 나옵니다.",g:"협력사 자금난이 부품 공급 중단으로 이어지지 않게 한다",o:[
  ["safe","협력사 결제 조건은 기존대로 두고 보험 보상을 기다리게 한다.",[2,4,1,1,1],"우리 현금은 지켰지만 작은 협력사 두 곳이 문을 닫았습니다.","일부 부품 공급이 끊겼습니다."],
  ["bold","피해가 큰 협력사 한 곳을 인수해 직접 복구한다.",[3,1,3,1,2],"공급은 안정됐지만 복구 비용을 우리가 모두 졌습니다.","공급 중단은 막았고 재무 부담이 늘었습니다."],
  ["share","보험금이 나올 때까지 협력사에 무이자 단기 자금을 빌려준다.",[2,1,3,4,1],"협력사가 모두 버텼지만 우리 현금이 줄었습니다.","공급 중단은 막았습니다. 상환이 늦어질 위험이 남았습니다."],
  ["lean","대체가 어려운 협력사에만 선급금을 주고 나머지는 다른 업체로 바꾼다.",[3,3,2,1,1],"현금은 적게 썼지만 거래가 끊긴 협력사가 생겼습니다.","핵심 공급은 지켰습니다."],
  ["shift","협력사와 공동으로 재해 보험과 비상 자금 기금을 만든다.",[1,2,3,2,2],"이번 위기에는 늦었지만 비용을 나눠 다음 재해에 대비했습니다.","이번 자금난을 푸는 효과는 작았습니다."]],
  c:"실제 사례 연결 없음. 재해가 협력사 자금난으로 번지는 경로를 판단하는 단계입니다.",
  k:["우발 부채","신용비용"]},
 {t:"4단계 · 복구 이후",q:"공업단지가 복구됐습니다. 같은 지역에 다시 홍수가 올 수 있다는 분석이 나왔습니다.",g:"재해 위험 지역 의존을 줄이되 원가 부담을 감당한다",o:[
  ["safe","원가가 가장 싼 원래 공급처로 돌아가고 재고만 조금 늘린다.",[2,3,2,1,1],"원가는 회복됐지만 위험 지역 의존은 그대로입니다.","짧은 충격에 대한 대비만 생겼습니다."],
  ["bold","핵심 부품 생산을 다른 나라로 모두 옮기도록 협력사에 요청하고 비용 일부를 댄다.",[3,0,4,1,2],"의존도가 크게 줄었지만 이전 비용이 컸습니다.","위험은 크게 줄고 재무 부담이 늘었습니다."],
  ["share","협력사들과 함께 공업단지 홍수 방어 시설 투자를 현지 정부에 제안한다.",[1,2,3,3,1],"현지 정부와 협력이 시작됐지만 실행까지 시간이 걸립니다.","위험 자체를 줄이는 길을 열었습니다."],
  ["lean","침수 위험이 큰 품목만 골라 두 번째 생산지를 둔다.",[3,3,2,1,1],"비용 대비 효과가 컸습니다.","핵심 위험을 막았습니다."],
  ["shift","공급처 평가 기준에 홍수·지진 같은 재해 위험 등급을 넣는다.",[1,2,3,1,3],"구매 절차가 복잡해졌습니다.","앞으로 공급처를 고를 때부터 위험이 줄어듭니다."]],
  c:"실제 사례 연결 없음. 태국 홍수가 보여 준 '한 지역 집중'의 위험을 가상기업의 구매 구조에 적용하는 단계입니다.",
  k:["세계 경제의 파편화","탈세계화"]},
 {t:"5단계 · 손실 회복",q:"이번 홍수로 한 분기 판매가 크게 줄었습니다(가정). 이사회가 손실을 메울 방안을 묻습니다.",g:"손실을 메우면서 다음 분기 회복을 앞당긴다",o:[
  ["safe","비용 절감과 투자 연기로 이익을 맞춘다.",[2,4,1,1,1],"이익은 회복됐지만 신차 일정이 밀렸습니다.","손실은 메웠고 회복 속도는 느려졌습니다."],
  ["bold","밀린 수요를 잡기 위해 잔업과 특근으로 증산한다.",[4,1,1,2,2],"판매가 빠르게 회복됐지만 인건비가 늘었습니다.","회복을 가장 앞당겼습니다."],
  ["share","특근 수당을 노조와 합의하고 협력사 증산 비용도 일부 보전한다.",[3,1,2,3,1],"갈등 없이 증산했지만 비용이 컸습니다.","회복은 빨랐고 손실을 메우는 속도는 느렸습니다."],
  ["lean","대기 수요가 많은 차종만 골라 증산한다.",[3,3,1,1,2],"적은 비용으로 판매를 회복했습니다.","두 목표를 효율적으로 맞췄습니다."],
  ["shift","이번 손실 경험을 반영해 재해 대응 매뉴얼과 보험 구조를 다시 짠다.",[1,3,2,1,3],"당장의 매출 회복에는 효과가 없습니다.","다음 재해 때 손실이 줄어듭니다."]],
  c:"실제 사례 연결 없음. 재해 손실을 회복하는 방식에 따라 다음 분기의 회사 모습이 어떻게 달라지는지 판단하는 단계입니다.",
  k:["잠재 비용"]}
]},
{id:"quakegap",grp:"gain",src:"add",title:"경쟁국 재해로 생긴 공백",cause:"자연재해",era:"2011",
 desc:"경쟁국 완성차들이 대지진으로 생산을 크게 줄였습니다. 해외 딜러들이 대신 팔 차를 찾습니다. 공백은 몇 달뿐이고, 우리도 같은 공급망에 묶여 있습니다.",
 w:[30,15,20,15,20],steps:[
 {t:"1단계 · 공백 발생",q:"대지진으로 일본 완성차 생산이 절반 넘게 줄었습니다. 미국·중동 딜러들이 일본차 대신 팔 차를 찾고 있습니다.",g:"경쟁국의 공급 공백을 우리 판매로 연결한다",o:[
  ["safe","기존 생산 계획을 유지하고 들어오는 주문만 받는다.",[1,4,1,1,2],"무리는 없었지만 늘어난 수요의 일부만 가져왔습니다.","기회를 대부분 놓쳤습니다."],
  ["bold","곧바로 잔업·특근으로 증산하고 해외 딜러에게 추가 물량을 약속한다.",[4,1,1,2,2],"판매가 크게 늘었지만 부품 조달과 인건비 부담이 커졌습니다.","공백을 가장 많이 가져왔습니다."],
  ["share","증산 계획을 협력사와 함께 세우고 협력사 설비 증설 자금을 일부 지원한다.",[3,1,3,3,1],"증산이 조금 늦었지만 부품 차질이 없었습니다.","공백을 꾸준히 가져왔습니다."],
  ["lean","일본차와 겹치는 차종만 골라 증산한다.",[4,3,1,1,1],"비용 대비 판매 증가가 컸습니다.","핵심 공백을 효율적으로 가져왔습니다."],
  ["shift","새로 연락해 온 딜러들과 장기 계약을 맺어 판매망을 넓힌다.",[2,2,1,2,3],"당장 판매는 크게 늘지 않았지만 판매망이 넓어졌습니다.","공백이 사라진 뒤에도 남는 기반을 만들었습니다."]],
  c:"2011년 3월 동일본 대지진 직후 일본 8개 완성차의 국내 생산은 57.5%(도요타 62.7%) 줄었습니다. 같은 해 현대·기아의 미국 점유율이 올랐다는 보도가 많았습니다(수치는 출처 확인 필요).",
  k:["세계 경제의 파편화"]},
 {t:"2단계 · 우리 공급망",q:"증산하려고 보니 우리도 일부 전자부품을 일본 업체에서 받고 있었습니다.",g:"우리 공급망의 일본 의존 때문에 기회를 놓치지 않는다",o:[
  ["safe","확보된 부품 범위 안에서만 증산한다.",[2,4,1,1,1],"무리는 없었지만 증산 폭이 작았습니다.","기회를 일부만 살렸습니다."],
  ["bold","대체 부품을 비싼 값에 대량 확보해 증산을 밀어붙인다.",[4,0,3,1,2],"증산은 계속됐지만 원가가 올랐습니다.","기회를 크게 살렸고 이익률은 낮아졌습니다."],
  ["share","국내 협력사에 대체 부품 개발을 맡기고 개발비를 함께 낸다.",[2,2,3,2,1],"개발에 몇 달이 걸렸지만 국내 공급망이 자랐습니다.","이번 기회에는 늦었지만 의존도는 줄었습니다."],
  ["lean","일본산 부품이 덜 들어가는 차종으로 증산을 몰아준다.",[4,3,1,1,1],"비용 없이 증산을 이어 갔습니다.","기회를 효율적으로 살렸습니다."],
  ["shift","2·3차 협력사까지 일본 의존 부품을 전수 조사해 목록을 만든다.",[2,2,3,1,2],"조사에 인력이 몰렸습니다.","당장 증산은 늘지 않았지만 숨은 의존이 드러났습니다."]],
  c:"르네사스 나카 공장이 3개월 멈추자, 일부 부품을 사실상 독점 공급받던 완성차들이 큰 타격을 받았습니다. 공백을 노리는 쪽도 같은 공급망에 묶여 있을 수 있습니다.",
  k:["세계 경제의 파편화","잠재 비용"]},
 {t:"3단계 · 가격",q:"일본차 공급이 줄자 시장 전체 가격이 오르고 있습니다.",g:"가격 기회를 살리되 새로 온 고객을 붙잡는다",o:[
  ["safe","가격을 그대로 두고 판매량만 늘린다.",[2,2,1,3,2],"새 고객 반응은 좋았지만 이익률은 그대로였습니다.","고객은 붙잡았고 가격 기회는 쓰지 않았습니다."],
  ["bold","시장 가격에 맞춰 크게 올린다.",[4,4,1,0,1],"이익은 크게 늘었지만 '위기 틈 가격 인상'이라는 평이 나왔습니다.","이익은 최대였고 재구매 의향은 낮아졌습니다."],
  ["share","가격은 조금만 올리고 늘어난 이익 일부를 딜러 판매 지원에 쓴다.",[2,3,1,3,1],"딜러가 적극적으로 팔았습니다.","두 목표를 고르게 달성했습니다."],
  ["lean","할인 폭만 줄여 실제 판매 가격을 올린다.",[3,3,1,2,1],"눈에 덜 띄게 이익이 늘었습니다.","이익은 늘었고 고객 반발은 작았습니다."],
  ["shift","가격 대신 품질 보증 기간을 늘려 새 고객의 첫 경험을 좋게 만든다.",[2,2,1,2,3],"보증 비용이 늘었지만 브랜드 신뢰가 올랐습니다.","당장 이익은 작았고 장기 고객이 늘었습니다."]],
  c:"실제 사례 연결 없음. 공급 부족기의 가격 결정이 새로 들어온 고객에게 미치는 영향을 판단하는 단계입니다.",
  k:["인플레이션율"]},
 {t:"4단계 · 경쟁사 회복",q:"몇 달 뒤 일본 완성차가 생산을 회복하기 시작했습니다. 늘려 둔 생산능력이 남을 수 있습니다.",g:"경쟁사가 회복한 뒤에도 늘어난 판매를 지킨다",o:[

  ["bold","판촉비를 크게 늘려 점유율을 끝까지 지킨다.",[3,0,1,2,3],"점유율은 지켰지만 판촉 비용이 컸습니다.","판매는 지켰고 이익은 줄었습니다."],
  ["share","늘린 인력은 순환 배치로 유지하고, 딜러와 장기 판매 목표를 함께 세운다.",[2,2,1,4,1],"고용과 딜러 관계는 지켰지만 고정비가 남았습니다.","판매를 상당 부분 지켰습니다."],
  ["lean","재구매율이 높은 차종만 생산을 유지하고 나머지는 줄인다.",[3,3,1,1,2],"남는 설비를 줄여 비용을 아꼈습니다.","핵심 판매를 지켰습니다."],
  ["shift","새 고객 데이터를 분석해 그 시장 전용 차종 개발에 들어간다.",[1,2,1,2,4],"개발비가 들고 효과는 2년 뒤에 나옵니다.","일시적 공백을 장기 경쟁력으로 바꾸는 시도입니다."]],
  c:"도요타는 대지진 뒤 4월 일본 생산이 78.4% 줄었지만, 재가동 뒤 같은 해 11월 완전 정상화를 내다봤습니다. 공백은 몇 달짜리였습니다.",
  k:["창조적 파괴"]},
 {t:"5단계 · 평판",q:"재해 복구가 한창인 가운데 '남의 재난으로 돈을 번다'는 비판 기사가 나왔습니다.",g:"늘어난 판매의 정당성과 브랜드 평판을 지킨다",o:[
  ["safe","따로 대응하지 않고 평소 홍보를 이어 간다.",[2,3,1,2,1],"비용은 들지 않았지만 비판이 잦아들지 않았습니다.","평판 회복이 느렸습니다."],
  ["bold","판매 실적을 적극 알리고 품질 경쟁력 덕분이라고 홍보한다.",[3,3,1,1,2],"판매는 이어졌지만 일부 소비자의 반감이 커졌습니다.","정당성은 주장했지만 평판은 엇갈렸습니다."],
  ["share","재해 지역 복구 지원과 부품 업계 협력을 발표한다.",[3,1,2,3,1],"비용이 들었지만 비판 여론이 누그러졌습니다.","평판을 빠르게 회복했습니다."],
  ["lean","늘어난 판매가 주로 경쟁 차종을 대신한 수요였다는 점을 자료로 설명한다.",[3,3,1,2,1],"적은 비용으로 오해를 일부 풀었습니다.","평판을 어느 정도 지켰습니다."],
  ["shift","재해 때 공급망을 서로 돕는 원칙을 업계 공동으로 만들자고 제안한다.",[1,2,3,2,2],"당장 효과는 작았지만 업계 신뢰가 쌓였습니다.","장기적으로 평판의 기반이 생겼습니다."]],
  c:"실제 사례 연결 없음. 경쟁국 재해로 얻은 이익을 어떻게 설명할지 판단하는 단계입니다.",
  k:["세계 경제의 파편화"]}
]},
{id:"usedcar",grp:"gain",src:"add",title:"신차 부족 속 새 사업",cause:"시장",era:"2021~2022",
 desc:"반도체 부족으로 신차 출고가 몇 달씩 밀리자 중고차 값이 치솟습니다. 신차만 팔던 회사에 중고차·구독 사업의 기회가 생깁니다.",
 w:[25,20,15,15,25],steps:[
 {t:"1단계 · 출고 대기",q:"신차 출고 대기가 6개월을 넘었습니다(가정). 기다리다 지친 고객이 중고차로 몰리면서 중고차 가격이 크게 올랐습니다.",g:"신차 공백기에 고객과 매출을 붙잡는다",o:[

  ["bold","인증 중고차 사업을 바로 시작하고 중고차 매입에 큰돈을 쓴다.",[4,1,1,1,3],"매출이 생겼지만 가격이 높을 때 대량 매입한 재고 위험을 졌습니다.","공백기 매출을 빠르게 만들었습니다."],

  ["lean","시승차와 전시차를 할인해 대기 고객에게 먼저 판다.",[4,3,1,1,1],"적은 비용으로 대기 고객 일부를 바로 출고했습니다.","공백 일부를 효율적으로 메웠습니다."],

  k:["인플레이션율","포모"]},
 {t:"2단계 · 매입 가격",q:"중고차 사업을 하려면 차를 사야 하는데, 지금 시세는 역대 최고 수준입니다.",g:"중고차 시세가 내려갈 때 손실을 보지 않는다",o:[

  ["bold","지금 시세로 대량 매입해 공급 부족기 이익을 최대한 가져간다.",[4,0,2,1,2],"단기 이익은 컸지만 시세 하락 위험을 그대로 안았습니다.","시세가 떨어지면 큰 손실이 납니다."],
  ["share","신차를 사는 고객의 기존 차를 시세보다 조금 높게 사 주는 보상 판매로 물량을 모은다.",[3,2,1,3,2],"신차 판매와 중고차 확보가 함께 이뤄졌습니다.","위험을 줄이며 물량을 모았습니다."],
  ["lean","회전이 빠른 인기 차종만 소량 매입해 재고 기간을 짧게 둔다.",[3,3,2,1,1],"이익은 작았지만 재고 위험이 거의 없었습니다.","시세 하락에 대비했습니다."],
  ["shift","리스가 끝나 돌아오는 차를 중고차로 쓰는 순환 구조를 설계한다.",[1,3,2,1,3],"구조를 만드는 데 1~2년이 걸립니다.","시세에 덜 흔들리는 공급 구조가 생깁니다."]],
  c:"실제 사례 연결 없음. 가격이 높을 때 자산을 사는 위험을 판단하는 단계입니다.",

 {t:"3단계 · 신차 가격",q:"대기 고객들은 '중고차 값이 더 비싸다'며 계약을 유지하고 있습니다. 회사 안에서는 신차 값도 올리자는 의견이 나옵니다.",g:"대기 고객을 지키면서 수익성을 높인다",o:[
  ["safe","가격은 그대로 두고 대기 고객 이탈만 관리한다.",[2,2,1,3,2],"고객 신뢰는 지켰지만 원가 상승분이 이익을 깎았습니다.","고객은 지켰고 수익성은 그대로였습니다."],
  ["bold","신규 계약 가격을 크게 올린다.",[4,4,1,0,1],"이익이 크게 늘었지만 신규 계약이 줄었습니다.","수익성은 높아졌고 새 고객 유입은 줄었습니다."],
  ["share","기존 계약 가격은 보장하고, 출고가 늦어진 기간만큼 보증을 늘려 준다.",[2,2,1,4,1],"이탈이 거의 없었습니다.","고객은 확실히 지켰고 수익성 개선은 작았습니다."],
  ["lean","옵션 묶음을 정리해 실제 판매가를 올린다.",[3,3,1,2,1],"눈에 덜 띄게 수익성이 좋아졌습니다.","두 목표를 적당히 맞췄습니다."],
  ["shift","출고 순서를 온라인으로 공개하는 대기 관리 시스템을 만든다.",[2,2,1,2,3],"구축 비용이 들었습니다.","대기 불만이 줄고 판매 방식이 바뀌었습니다."]],
  c:"테슬라는 2021년 반도체 부족 속에서 모델 Y 가격을 18% 올렸습니다.",

 {t:"4단계 · 공급 정상화",q:"반도체 공급이 풀리자 중고차 시세가 빠르게 떨어집니다. 쌓아 둔 중고차 재고가 있습니다.",g:"시세 하락기 손실을 줄이고 새 사업을 유지한다",o:[

  ["bold","시세가 다시 오를 것으로 보고 재고를 들고 버틴다.",[2,1,2,2,2],"보관 비용이 늘었고, 시세가 계속 내려가면 손실이 커집니다.","결과가 시세 방향에 달렸습니다."],
  ["share","딜러와 재고 손실을 나눠 지고 함께 판촉한다.",[3,2,1,3,1],"손실 부담이 줄고 딜러 관계가 유지됐습니다.","손실을 나눠 줄였습니다."],
  ["lean","재고를 렌터카·법인 리스 업체에 묶음으로 넘긴다.",[4,3,1,1,1],"할인 판매였지만 재고가 한 번에 정리됐습니다.","손실을 빠르게 제한했습니다."],
  ["shift","중고차 재고를 구독 서비스 차량으로 돌려 쓴다.",[2,2,1,1,4],"판매 손실은 피했지만 차량 관리 비용이 생겼습니다.","손실을 줄이면서 새 사업을 키웠습니다."]],
  c:"실제 사례 연결 없음. 공급 부족기의 가격 상승이 정상화로 되돌아올 때의 위험을 판단하는 단계입니다.",
  k:["투기성 투자"]},
 {t:"5단계 · 사업 구조",q:"위기 때 시작한 중고차·구독 사업을 계속할지 정해야 합니다.",g:"위기 때 만든 사업을 장기 수익원으로 바꿀지 판단한다",o:[

  ["bold","새 사업을 별도 회사로 분리하고 외부 투자를 받아 키운다.",[3,2,1,1,3],"성장 속도가 빨라졌지만 지분 일부를 내줬습니다.","장기 수익원으로 키울 길이 열렸습니다."],
  ["share","딜러망이 중고차·구독 사업을 함께 운영하도록 수익을 나누는 구조를 만든다.",[2,2,1,4,1],"딜러 참여가 늘었습니다.","사업이 안정적으로 이어졌습니다."],

  c:"실제 사례 연결 없음. 위기 때 생긴 사업을 계속할지 판단하는 단계입니다.",

]},
{id:"fxboom",grp:"gain",src:"add",title:"환율 급등을 수출 기회로",cause:"금융",era:"1997~1999",
 desc:"외환위기로 원화 가치가 절반 아래로 떨어졌습니다. 같은 차를 해외에서 훨씬 싸게 팔 수 있게 됐지만, 회사는 아직 빚과 30% 금리에 눌려 있습니다.",
 w:[25,30,10,15,20],steps:[
 {t:"1단계 · 원화 폭락",q:"원/달러 환율이 800원대에서 1,962원까지 올랐습니다. 같은 차를 달러로 팔면 원화 수입이 두 배 넘게 늘어납니다. 내수 시장은 얼어붙었습니다.",g:"환율 기회를 수출 확대로 연결한다",o:[
  ["safe","해외 가격은 그대로 두고 늘어난 원화 수입을 빚 갚는 데 쓴다.",[2,4,1,1,2],"부채가 빠르게 줄었지만 수출 물량은 크게 늘지 않았습니다.","재무는 좋아졌고 수출 확대 기회는 작게 썼습니다."],
  ["bold","해외 가격을 크게 낮춰 경쟁사 점유율을 가져온다.",[4,1,1,2,2],"수출이 급증했지만 대당 이익은 작아졌습니다.","수출을 가장 크게 늘렸습니다."],
  ["share","내수용 생산 인력을 수출 라인으로 돌려 고용을 유지하며 수출을 늘린다.",[3,2,1,3,1],"고용은 지켰고 수출이 늘었습니다.","내수 위축을 수출로 메웠습니다."],
  ["lean","해외 가격은 일부만 낮추고, 이익률이 높은 시장부터 물량을 늘린다.",[3,3,1,1,2],"이익과 물량이 함께 늘었습니다.","기회를 효율적으로 썼습니다."],
  ["shift","그동안 진출하지 못한 새 수출 시장에 딜러망을 연다.",[2,2,1,1,4],"초기 비용이 들고 판매는 천천히 늘었습니다.","환율이 돌아와도 남는 시장을 만들었습니다."]],
  c:"원/달러 환율은 1997년 12월 23일 1,962원을 기록했습니다(그 전에는 600~800원대). 1998년 한국 경상수지가 큰 흑자로 돌아섰다는 사실이 널리 알려져 있습니다(규모는 출처 확인 필요).",
  k:["통화 불일치의 대차대조표 효과"]},
 {t:"2단계 · 수입 부품",q:"수출을 늘리려니 수입 부품 값도 두 배가 됐습니다. 차 한 대 원가의 30%가 수입 부품입니다(가정).",g:"원가 상승 속에서도 수출 이익을 남긴다",o:[
  ["safe","수입 부품이 많은 차종의 수출은 줄인다.",[2,4,1,1,1],"손실 위험은 줄었지만 수출 물량도 줄었습니다.","이익은 지켰고 기회 일부를 버렸습니다."],
  ["bold","원가 상승을 감수하고 물량을 계속 늘린다.",[4,0,2,2,2],"매출은 늘었지만 이익률이 떨어졌습니다.","물량은 늘었고 이익은 작았습니다."],
  ["share","국내 협력사에 수입 부품 대체 개발을 맡기고 물량을 보장한다.",[2,2,3,2,1],"협력사 일감이 늘고 원가가 서서히 내려갔습니다.","시간이 지나며 이익이 늘었습니다."],
  ["lean","수입 부품 대금을 수출로 번 달러로 바로 결제해 환전 손실을 없앤다.",[3,4,1,1,1],"환율 위험이 줄었습니다.","원가 부담을 효율적으로 줄였습니다."],
  ["shift","수입 부품이 덜 들어가도록 설계를 바꾼다.",[1,2,3,1,3],"설계 변경에 1년이 걸렸습니다.","이후 환율에 덜 흔들립니다."]],
  c:"실제 사례 연결 없음. 수출 기회와 수입 원가 상승이 동시에 오는 구조를 계산해 보는 단계입니다.",
  k:["통화 불일치의 대차대조표 효과"]},
 {t:"3단계 · 운영 자금",q:"수출을 늘리려면 운영 자금이 필요한데 시장 금리는 30%입니다.",g:"비싼 금리 속에서 수출 확대 자금을 마련한다",o:[
  ["safe","금리가 내릴 때까지 지금 자금 범위 안에서만 수출을 늘린다.",[2,4,1,1,1],"이자 부담은 없었지만 수출 확대 속도가 느렸습니다.","자금은 지켰고 기회는 작게 썼습니다."],
  ["bold","30% 금리라도 빌려 수출을 최대한 늘린다.",[4,0,1,2,2],"수출은 크게 늘었지만 이자가 이익 대부분을 가져갔습니다.","확대는 했지만 남는 것이 적었습니다."],
  ["share","해외 딜러에게 선금을 받는 대신 공급 물량과 가격을 보장한다.",[3,3,1,3,1],"비싼 빚 없이 자금이 생겼습니다.","딜러와 함께 자금을 마련했습니다."],
  ["lean","수출 신용장을 담보로 무역금융을 받는다.",[3,3,1,1,2],"일반 대출보다 금리가 낮았습니다.","자금을 효율적으로 마련했습니다."],
  ["shift","해외 투자자에게 지분 일부를 팔아 자본을 늘린다.",[2,3,1,1,3],"경영권 일부를 내줬지만 빚 없이 자금이 생겼습니다.","자금과 재무 구조를 함께 개선했습니다."]],
  c:"외환위기 때 실세금리는 30%에 이르렀지만 법정 최고이율 25%에 막혀 자금 시장이 마비됐습니다.",
  k:["자금조달비용","신용비용"]},
 {t:"4단계 · 국내 경쟁",q:"다른 국내 완성차들도 환율 덕분에 수출을 늘리면서 해외에서 가격 경쟁이 붙었습니다.",g:"국내 경쟁사와의 출혈 경쟁을 피하면서 수출 몫을 지킨다",o:[
  ["safe","가격 경쟁에서 빠지고 남는 물량만 판다.",[2,4,1,1,1],"이익률은 지켰지만 수출 몫이 줄었습니다.","출혈은 피했고 몫은 잃었습니다."],
  ["bold","가격을 더 낮춰 경쟁에서 이긴다.",[4,0,1,2,2],"점유율은 늘었지만 이익이 거의 남지 않았습니다.","몫은 지켰고 출혈이 컸습니다."],
  ["share","품질 인증·해상 운송 같은 수출 기반은 국내 경쟁사와 함께 쓰고, 가격은 각자 정한다.",[2,2,2,3,1],"수출 비용이 줄었습니다. 담합으로 오해받지 않도록 협력 범위를 조심해야 했습니다.","출혈을 줄이며 몫을 지켰습니다."],
  ["lean","경쟁이 덜한 차급과 시장으로 물량을 돌린다.",[3,3,1,1,2],"이익률을 지키며 판매가 이어졌습니다.","출혈 없이 몫을 지켰습니다."],
  ["shift","가격 대신 디자인과 보증으로 차별화한 수출 전용 모델을 낸다.",[1,2,1,2,4],"개발비가 들었습니다.","가격 경쟁에서 벗어날 길을 만들었습니다."]],
  c:"실제 사례 연결 없음. 같은 환율 혜택을 받는 국내 경쟁사끼리의 경쟁을 판단하는 단계입니다.",
  k:["절약의 역설"]},
 {t:"5단계 · 환율 안정",q:"1~2년 뒤 환율이 안정되기 시작합니다. 환율 덕에 늘린 수출을 어떻게 지킵니까?",g:"환율 효과가 사라져도 남는 경쟁력을 만든다",o:[
  ["safe","환율 이익으로 줄여 둔 부채 덕분에 생긴 재무 체력으로 버틴다.",[2,4,1,1,2],"재무는 탄탄하지만 수출 물량은 서서히 줄었습니다.","버틸 힘은 남았고 경쟁력은 그대로입니다."],
  ["bold","가격을 그대로 유지해 늘어난 점유율을 지킨다.",[3,1,1,2,3],"점유율은 지켰지만 이익률이 크게 떨어졌습니다.","몫은 남고 이익은 줄었습니다."],
  ["share","해외 딜러와 장기 계약을 맺고 공동 마케팅 비용을 나눈다.",[2,2,1,4,1],"딜러가 계속 우리 차를 팔았습니다.","판매망이 남아 수출이 크게 줄지 않았습니다."],
  ["lean","환율이 내려가도 이익이 나는 차종과 시장만 남긴다.",[3,3,1,1,2],"수출 규모는 줄었지만 이익률이 지켜졌습니다.","작지만 단단한 수출 구조가 남았습니다."],
  ["shift","해외 현지 조립을 시작해 환율에 덜 흔들리는 구조를 만든다.",[1,2,2,1,4],"투자비가 들고 몇 년이 걸립니다.","환율과 상관없이 남는 경쟁력을 만들기 시작했습니다."]],
  c:"외환위기 뒤 한국 기업들은 부채비율을 크게 낮추는 쪽으로 바뀌었습니다(변화 수치는 출처 확인 필요).",
  k:["자기자본 대비 부채비율"]}
]},
{id:"lithium",grp:"loss",src:"add",title:"배터리 원자재 급등",cause:"원자재",era:"2021~2023",
 desc:"첫 전기차를 준비하던 중 배터리 원자재 가격이 몇 배로 뜁니다. 출시 계획과 가격, 공급 계약이 한꺼번에 흔들리고, 1년 뒤에는 다시 급락합니다.",
 w:[20,25,25,10,20],steps:[
 {t:"1단계 · 원자재 급등",q:"첫 전기 SUV 출시를 1년 앞두고 리튬 등 배터리 원자재 가격이 1년 사이 몇 배로 올랐습니다. 배터리는 전기차 원가에서 큰 몫을 차지합니다.",g:"원자재 급등 속에서 전기차 출시 계획을 지킨다",o:[
  ["safe","원자재 가격이 안정될 때까지 출시를 1년 미룬다.",[2,4,1,1,1],"손실 위험은 줄었지만 경쟁사보다 늦어졌습니다.","출시 계획은 지키지 못했습니다."],
  ["bold","지금 가격으로 배터리 3년치를 장기 계약하고 출시를 강행한다.",[4,0,3,1,2],"공급은 확보했지만 비싼 가격이 고정됐습니다.","계획은 지켰고 가격이 내리면 손해를 봅니다."],
  ["share","배터리 업체와 원자재 가격에 따라 값이 바뀌는 계약을 맺어 위험을 나눈다.",[2,2,3,2,1],"협상이 길었지만 가격 위험을 나눴습니다.","계획을 크게 늦추지 않았습니다."],
  ["lean","배터리 용량이 작은 저가 트림부터 먼저 낸다.",[3,3,2,1,1],"원가 부담은 작았지만 주행거리가 짧아 관심이 낮았습니다.","계획은 지켰고 상품성은 낮아졌습니다."],
  ["shift","리튬 부담이 적은 다른 배터리 방식(LFP 등) 적용을 검토한다.",[1,2,3,1,3],"설계 변경으로 출시가 몇 달 밀렸습니다.","원자재 가격에 덜 흔들리는 구조가 됩니다."]],
  c:"2021~2022년 리튬 등 배터리 원자재 가격이 크게 올랐다는 보도가 이어졌습니다(상승 폭은 출처 확인 필요).",
  k:["인플레이션율","잠재 비용"]},
 {t:"2단계 · 판매 가격",q:"원자재 값 때문에 전기 SUV 원가가 계획보다 크게 올랐습니다(가정). 보조금을 받으려면 정부가 정한 가격 상한도 맞춰야 합니다.",g:"보조금을 받을 수 있는 가격에서 이익을 남긴다",o:[
  ["safe","원가를 그대로 반영해 가격을 올리고 보조금은 포기한다.",[2,4,1,0,2],"대당 이익은 지켰지만 판매가 크게 줄었습니다.","이익은 남겼고 판매는 놓쳤습니다."],
  ["bold","보조금 기준에 맞춰 가격을 낮추고 손실을 감수한다.",[3,0,1,3,3],"판매는 늘었지만 팔수록 손해가 났습니다.","판매는 얻었고 이익은 잃었습니다."],
  ["share","배터리 업체·정부와 원가 분담과 보조금 기준 조정을 협의한다.",[2,2,2,3,1],"협상에 시간이 걸렸지만 부담이 나뉘었습니다.","두 목표를 어느 정도 맞췄습니다."],
  ["lean","보조금 기준에 맞춘 기본 트림과 이익이 남는 고급 트림을 함께 낸다.",[3,3,1,1,2],"판매와 이익을 트림별로 나눠 맞췄습니다.","효율적으로 목표에 다가갔습니다."],
  ["shift","배터리는 따로 빌려 쓰고 차만 파는 배터리 구독 상품을 만든다.",[2,2,1,1,4],"구조가 복잡해졌지만 차 값이 크게 낮아졌습니다.","가격 문제를 새로운 방식으로 풀었습니다."]],
  c:"실제 사례 연결 없음. 원가 상승과 보조금 가격 기준 사이에서 판단하는 단계입니다(보조금 제도 세부는 나라마다 다릅니다).",
  k:["잠재 비용"]},
 {t:"3단계 · 물량 축소 통보",q:"배터리 업체가 원자재 부족을 이유로 우리 물량을 줄이겠다고 통보했습니다. 대형 완성차가 먼저 물량을 받습니다.",g:"협상력이 약한 상황에서 배터리 물량을 확보한다",o:[
  ["safe","줄어든 물량에 맞춰 생산 계획을 줄인다.",[2,4,1,1,1],"추가 비용은 없었지만 판매 목표를 낮춰야 했습니다.","물량은 확보하지 못했습니다."],
  ["bold","웃돈을 주고 다른 배터리 업체 물량을 산다.",[4,0,3,1,1],"생산은 지켰지만 배터리 단가가 크게 올랐습니다.","물량은 확보했고 원가가 올랐습니다."],
  ["share","다른 중견 완성차들과 공동 구매 연합을 만들어 협상력을 키운다.",[2,3,3,2,1],"협상에 시간이 걸렸지만 물량과 단가가 모두 나아졌습니다.","물량을 늦게, 그러나 싸게 확보했습니다."],
  ["lean","배터리 업체에 선급금을 주고 우선 공급 순위를 산다.",[3,2,3,1,1],"현금이 묶였지만 물량 순위가 올라갔습니다.","물량을 비교적 빨리 확보했습니다."],
  ["shift","원자재 광산·정련 업체에 소규모 지분 투자를 한다.",[1,1,4,1,3],"투자금이 들고 효과는 몇 년 뒤에 나옵니다.","이번 부족에는 늦었지만 장기 물량의 기반이 생겼습니다."]],
  c:"실제 사례 연결 없음. 협상력이 약한 중견 기업의 원자재 확보 판단 단계입니다.",
  k:["세계 경제의 파편화","탈세계화"]},
 {t:"4단계 · 원자재 국가 위험",q:"배터리 원자재 정련의 대부분이 한 나라에 몰려 있다는 보고가 올라왔습니다. 그 나라와 주요국의 갈등도 커지고 있습니다.",g:"원자재 공급이 한 나라의 정책에 끊기지 않게 한다",o:[

{id:"ira",grp:"gain",src:"add",title:"현지 생산 보조금 기회",cause:"정치·통상",era:"2022~2025",
 desc:"주요국이 자국에서 만든 전기차에만 큰 세액공제를 주기로 합니다. 수출 기업에는 위기이지만, 먼저 현지 생산을 갖춘 회사에는 기회입니다.",
 w:[20,20,15,15,30],steps:[
 {t:"1단계 · 보조금 법 통과",q:"한 주요국이 북미에서 최종 조립한 전기차에만 대당 최대 7,500달러 세액공제를 주는 법을 만들었습니다. 우리는 그 시장에 수출만 하고 있습니다.",g:"보조금 정책을 시장 확대 기회로 바꾼다",o:[
  ["safe","그 시장의 전기차 수출 계획을 줄이고 다른 시장에 집중한다.",[2,4,1,1,1],"투자 위험은 없었지만 큰 시장을 내줬습니다.","기회를 쓰지 않았습니다."],
  ["bold","현지 전기차 공장 건설을 바로 발표한다.",[4,0,1,2,3],"투자 부담이 컸지만 현지 정부와 딜러의 기대가 높아졌습니다.","기회를 가장 크게 잡으러 갔습니다."],
  ["share","현지에 진출한 국내 배터리 업체와 합작 공장을 추진한다.",[2,2,2,2,2],"투자와 위험을 나눴습니다.","기회를 안정적으로 잡아 가고 있습니다."],
  ["lean","리스 차량은 다른 조항으로 공제를 받을 수 있다는 점을 활용해 리스 판매를 늘린다.",[4,3,1,1,1],"투자 없이 판매를 이어 갔습니다.","당장의 손실은 막았지만 근본 해결은 아닙니다."],
  ["shift","현지 업체에 위탁 조립을 맡겨 큰 투자 없이 조건을 맞추는 방안을 검토한다.",[2,3,2,1,2],"검토에 몇 달이 걸렸습니다.","투자 부담 없이 조건을 맞출 길을 찾았습니다."]],
  c:"미국 인플레이션 감축법(IRA, 2022년 8월)은 북미에서 최종 조립한 전기차에 대당 최대 7,500달러의 세액공제를 주도록 했습니다. 리스 차량은 상업용 조항으로 공제를 받을 수 있어 한국 업체들이 리스 판매를 늘렸다는 보도가 있었습니다(세부는 출처 확인 필요).",
  k:["탈세계화","세계 경제의 파편화"]},
 {t:"2단계 · 부품·광물 조건",q:"보조금을 받으려면 배터리 부품과 광물도 정해진 나라에서 와야 합니다. 우리 배터리 원료 일부는 조건 밖 나라에서 옵니다.",g:"부품·광물 조건을 맞춰 보조금을 받는다",o:[
  ["safe","조건을 맞출 수 있는 차종만 그 시장에 보낸다.",[2,4,1,1,1],"무리는 없었지만 판매 차종이 줄었습니다.","보조금은 일부만 받았습니다."],
  ["bold","비싸더라도 조건에 맞는 원료로 공급망을 한꺼번에 바꾼다.",[3,0,4,1,2],"원가가 올랐지만 모든 차종이 조건을 맞췄습니다.","보조금을 최대로 받게 됐습니다."],
  ["share","배터리·소재 협력사와 함께 조건에 맞는 공급망을 단계적으로 만든다.",[2,2,3,2,1],"속도는 느렸지만 협력사도 함께 조건을 맞췄습니다.","시간이 지나며 보조금 대상이 늘었습니다."],
  ["lean","보조금 효과가 큰 모델만 골라 공급망을 바꾼다.",[3,3,2,1,1],"비용 대비 효과가 컸습니다.","핵심 모델의 보조금을 확보했습니다."],
  ["shift","원료 추적 시스템을 만들어 모든 부품의 원산지를 관리한다.",[1,2,3,1,3],"시스템 구축에 시간이 걸렸습니다.","앞으로 조건이 바뀌어도 빠르게 대응할 수 있습니다."]],
  c:"IRA는 배터리 부품과 핵심 광물의 원산지 요건도 세액공제 조건으로 두었습니다(비율과 시행 일정은 출처 확인 필요).",
  k:["탈세계화"]},
 {t:"3단계 · 국내 반발",q:"현지 공장을 지으면 국내 공장 물량이 줄어든다며 노조와 지역사회가 반발합니다.",g:"해외 생산 확대와 국내 생산 기반 사이 균형을 잡는다",o:[

  ["bold","국내 물량 감소를 감수하고 현지 생산을 크게 늘린다.",[3,2,1,0,4],"현지 경쟁력은 커졌지만 국내 갈등이 깊어졌습니다.","해외 확대는 컸고 국내 기반은 흔들렸습니다."],
  ["share","국내 공장은 고부가 차종과 수출 기지로 키우겠다고 노조와 협약한다.",[2,2,1,4,1],"협약에 시간이 걸렸지만 갈등이 가라앉았습니다.","양쪽 기반을 함께 지켰습니다."],
  ["lean","현지에는 조립만 두고 핵심 부품은 국내에서 만들어 보낸다.",[3,3,2,1,1],"국내 물량 감소가 작았습니다.","균형을 효율적으로 맞췄습니다."],
  ["shift","국내 공장을 전동화 부품 생산 기지로 바꾸는 계획을 세운다.",[1,2,2,2,3],"전환 투자가 필요합니다.","국내 공장의 역할을 새로 만들었습니다."]],
  c:"실제 사례 연결 없음. 해외 생산 확대가 국내 고용과 협력사로 미치는 파급을 판단하는 단계입니다.",
  k:["블루칼라 노동자","탈세계화"]},

  ["safe","투자를 3단계로 나눠 판매가 확인될 때마다 다음 단계를 진행한다.",[2,4,1,1,2],"재무 부담이 작았지만 생산 확대가 느렸습니다.","위기 없이 투자를 이어 갔습니다."],
  ["bold","전액 차입으로 한 번에 짓는다.",[4,0,1,1,4],"공장은 빨리 섰지만 부채비율이 크게 올랐습니다.","투자는 했고 재무 위험이 커졌습니다."],
  ["share","현지 주정부 인센티브와 협력사 동반 투자를 끌어낸다.",[2,3,1,3,1],"협상에 시간이 걸렸지만 부담이 크게 줄었습니다.","재무 위험을 나눠 줄였습니다."],
  ["lean","현지의 기존 공장을 인수해 개조한다.",[3,3,1,1,2],"새로 짓는 것보다 비용과 시간이 줄었습니다.","효율적으로 투자했습니다."],
  ["shift","녹색채권과 정책금융으로 조달한다.",[2,3,1,1,3],"금리는 낮았지만 사용처 제한과 보고 의무가 생겼습니다.","조달 구조를 바꿨습니다."]],
  c:"실제 사례 연결 없음. 보조금 기회와 투자 부담을 함께 계산하는 단계입니다.",

  ["bold","정책과 상관없이 현지 점유율을 끝까지 늘린다.",[3,1,1,2,3],"점유율은 올랐지만 보조금이 줄면 이익이 떨어집니다.","결과가 정책 방향에 달렸습니다."],
  ["share","현지 업계·주정부와 함께 고용 효과를 알리며 정책 유지를 요청한다.",[2,2,1,4,1],"현지 지지가 생겼습니다.","정책 변화 위험을 조금 줄였습니다."],

function calc(){
  const {picks,opts,w}=st, sc=st.sc;
  const dimScore=DIMS.map((d,k)=>{
    const max=sum(opts.map(os=>Math.max(...os.map(o=>o[2][k]))));
    return max?Math.round(sum(picks.map(o=>o[2][k]))/max*100):0;
  });
  const got=sum(picks.map(o=>ws(o,w)));
  const max=sum(opts.map(os=>Math.max(...os.map(o=>ws(o,w)))));
  const cnt={};SKEYS.forEach(k=>cnt[k]=0);picks.forEach(o=>{if(cnt[o[0]]!=null)cnt[o[0]]++});
  const n=picks.length, wTop=topIdx(w), hitW=o=>topIdx(o[2]).some(k=>wTop.includes(k));
  let jH=0,jD=0,aH=0,pH=0,pD=0; const fit=[],bestSty=[],kc={};
  picks.forEach((o,i)=>{
    const os=opts[i];
    if(os.some(hitW)){jD++; if(o!==DELAY&&hitW(o)) jH++}
    const b=Math.max(...os.map(x=>ws(x,w)));
    const bs=[...new Set(os.filter(x=>ws(x,w)===b).map(x=>x[0]))]; bestSty.push(bs);
    if(bs.includes(o[0])) aH++;
    const f=Math.round(ws(o,w)/b*100); fit.push(f);
    (sc.steps[i].k||[]).forEach(c=>{kc[c]=kc[c]||[0,0];kc[c][0]+=f;kc[c][1]++});
    if(st.pred[i]!=null){pD++; if(topIdx(o[2]).includes(st.pred[i])) pH++}
  });
  const need=Math.ceil(n*.8);
  const neg=DIMS.map((_,k)=>k).filter(k=>picks.filter(o=>o[2][k]<=1).length>=need);
  const tiers=[...new Set(w)].sort((a,b)=>b-a), dx=st.dx;
  const pct=(a,b)=>b?Math.round(a/b*100):null;
  const ab={dx:dx==null?null:w[dx]===tiers[0]?100:w[dx]===tiers[1]?50:0,
    judge:pct(jH,jD),adapt:pct(aH,n),bal:Math.max(0,100-25*neg.length),pred:pct(pH,pD)};
  return {dimScore,total:Math.round(got/max*100),cnt,ab,pr:pD?[pH,pD]:null,neg,need,kc,fit,bestSty,wTop};
}

function radar(vals){
  const cx=160,cy=150,R=100,n=DIMS.length;
  const pt=(k,v)=>{const a=-Math.PI/2+k*2*Math.PI/n;return [cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100]};
  const ring=v=>DIMS.map((_,k)=>pt(k,v).join(",")).join(" ");
  const poly=vals.map((v,k)=>pt(k,v).join(",")).join(" ");
  const labels=DIMS.map((d,k)=>{const [x,y]=pt(k,118);const a=Math.cos(-Math.PI/2+k*2*Math.PI/n);
    const anchor=Math.abs(a)<.2?"middle":a>0?"start":"end";
    return `<text x="${x}" y="${y+4}" text-anchor="${anchor}" font-size="11.5" fill="var(--fg)" font-family="var(--font-body)">${esc(d)}</text>`}).join("");
  return `<svg class="radar" viewBox="-10 0 340 300" role="img" aria-label="영역별 비중 레이더 차트: ${DIMS.map((d,k)=>d+" "+vals[k]).join(", ")}">

    ${DIMS.map((_,k)=>{const [x,y]=pt(k,100);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`}).join("")}
    <polygon points="${poly}" fill="var(--co)" fill-opacity=".22" stroke="var(--co)" stroke-width="2" stroke-linejoin="round"/>
    ${vals.map((v,k)=>{const [x,y]=pt(k,v);return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--co)"/>`}).join("")}
    ${labels}</svg>`;
}
function surviveMsg(g){
  const m=Math.min(...g), k=g.indexOf(m);
  if(m>=30) return ["회사가 위기를 이겨 냈습니다.",`가장 낮은 영역도 ${m}입니다.`];
  if(m>=10) return ["간신히 버텼습니다.",`<b>${esc(DIMS[k])}</b>이(가) ${m}까지 떨어졌습니다. 다음 충격이 오면 위험합니다.`];
  return ["회사가 무너지기 직전입니다.",`<b>${esc(DIMS[k])}</b>이(가) ${m}입니다. 이 부분이 무너지면 다른 영역이 좋아도 회사가 버티기 어렵습니다.`];
}

  </section>
  <section class="q survive"><div class="q-h"><h2>회사 상태</h2></div>
    <p class="msg">${sv[0]}</p><p class="note">${sv[1]} 회사 상태는 결정마다 움직인 결과이고, 점수와는 따로 봅니다.</p>${hud()}</section>
  <section class="q"><div class="q-h"><h2>이번 도전의 능력 평가</h2></div>
    <p class="q-sub">성향과 따로 본 능력입니다. 0~100으로 표시합니다.</p>

  <section class="q"><div class="q-h"><h2>내가 무게를 둔 영역</h2></div>
    <p class="q-sub">보기로 나온 선택지에서 얻을 수 있었던 최대치 대비 비율입니다. 이 위기에서 가장 중요한 영역은 <b style="color:var(--fg)">${esc(DIMS[topW])}</b>(가중치 ${w[topW]})입니다.${changedW?` 가중치는 ${esc(st.cn)}의 조건에 맞게 조정됐습니다.`:""}</p>

  <section class="q"><div class="q-h"><h2>단계별 복기</h2></div>
    <div class="rev">${sc.steps.map((s,n)=>{const me=picks[n], p=st.pred[n], tops=topIdx(me[2]), wy=st.why[n];

        <div class="note">Q${n+1} · ${esc(s.t)}</div>

        <div class="a"><span class="chip sty">${styName(me[0])}</span> ${esc(me[1])}</div>

        <div class="a"><span class="l">결과</span>${esc(me[4])}</div>

        ${p!=null?`<div class="a"><span class="l">예측</span>${esc(DIMS[p])} → 실제로 가장 크게 도움이 된 영역 ${esc(tops.map(k=>DIMS[k]).join(", "))} (${tops.includes(p)?"같음":"다름"})</div>`:""}

        ${caseBox(s)}

  <div class="actions"><button class="cta" id="retry">다른 방식으로 다시 도전</button><button class="ghost" id="other">다른 위기 고르기</button><button class="ghost" id="rep">나의 경영 리포트</button></div>`;

  $.querySelector("#other").onclick=()=>go("home");
  $.querySelector("#rep").onclick=()=>go("report");
