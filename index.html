// 기록 옮기기: 서버 없이 코드(또는 파일)로 내보내고 불러오기
const XPRE="CRISIS1.";
const encHist=h=>XPRE+btoa(unescape(encodeURIComponent(JSON.stringify(h))));
function decHist(s){
  s=String(s||"").replace(/\s+/g,"");
  let raw=s;
  if(s.startsWith(XPRE)){try{raw=decodeURIComponent(escape(atob(s.slice(XPRE.length))))}catch(e){return null}}
  let h; try{h=JSON.parse(raw)}catch(e){return null}
  if(!Array.isArray(h)) return null;
  return h.filter(r=>r&&typeof r==="object"&&typeof r.id==="string"&&SCN.some(x=>x.id===r.id)&&isNum(r.t)&&isNum(r.at)).map(cleanRec);
}
const isNum=v=>typeof v==="number"&&isFinite(v);
const pctN=v=>isNum(v)?Math.max(0,Math.min(100,Math.round(v))):null;
function cleanRec(r){
  const o={id:r.id,d:DIFF[r.d]?r.d:"normal",t:pctN(r.t)??0,at:r.at,
    dims:DIMS.map((_,k)=>Array.isArray(r.dims)?pctN(r.dims[k])??0:0),cnt:{}};
  SKEYS.forEach(k=>o.cnt[k]=r.cnt&&isNum(r.cnt[k])?Math.max(0,Math.min(5,r.cnt[k]|0)):0);
  if(r.ab&&typeof r.ab==="object"){o.ab={};["dx","judge","adapt","bal","pred"].forEach(k=>o.ab[k]=pctN(r.ab[k]))}
  if(Array.isArray(r.pr)&&isNum(r.pr[0])&&isNum(r.pr[1])&&r.pr[1]>0) o.pr=[Math.min(r.pr[0],r.pr[1])|0,r.pr[1]|0];
  if(Array.isArray(r.neg)) o.neg=r.neg.filter(k=>Number.isInteger(k)&&k>=0&&k<DIMS.length);
  if(r.kc&&typeof r.kc==="object"){o.kc={};Object.entries(r.kc).forEach(([c,v])=>{if(typeof c==="string"&&c.length<40&&Array.isArray(v)&&isNum(v[0])&&isNum(v[1])&&v[1]>0)o.kc[c]=[v[0],v[1]]})}
  if(isNum(r.to)) o.to=Math.max(0,Math.min(5,r.to|0));
  if(Array.isArray(r.sty)) o.sty=r.sty.map(s=>STY[s]||s==="delay"?s:"delay").slice(0,5);
  if(Array.isArray(r.why)) o.why=r.why.slice(0,5).map(w=>typeof w==="string"?w.slice(0,150):"");
  if(COS[r.co]) o.co=r.co;
  if(r.tr&&typeof r.tr==="object"){o.tr={};Object.keys(TRAITS).forEach(x=>{if(TRAITS[x].o[r.tr[x]]) o.tr[x]=r.tr[x]})}
  return o;
}
function mergeHist(inc){
  const cur=getHist(), keys=new Set(cur.map(r=>r.id+"@"+r.at));
  const add=inc.filter(r=>!keys.has(r.id+"@"+r.at));
  store.set(HKEY,cur.concat(add).sort((a,b)=>a.at-b.at).slice(-300));
  return {add:add.length,dup:inc.length-add.length};
}
const canFile=(()=>{try{return window.self===window.top}catch(e){return false}})();
function xferCard(has){
  return `<section class="q" id="xfer"><div class="q-h"><h2>기록 옮기기</h2></div>
    <p class="q-sub">다른 기기나 브라우저로 기록을 옮길 때 씁니다. 기록은 서버에 저장되지 않고, 코드에는 이름 같은 개인정보가 들어가지 않습니다(결정 이유로 적은 글과 회사 조건은 들어갑니다). 불러오면 지금 기록에 합쳐지고 겹치는 기록은 한 번만 남습니다.</p>
    ${has?`<div class="actions"><button class="cta" id="xCopy">기록 코드 복사</button>${canFile?`<button class="ghost" id="xFile">파일로 저장</button>`:""}</div>
    <textarea class="txt code" id="xOut" readonly hidden aria-label="기록 코드"></textarea>`:""}
    <textarea class="txt code" id="xIn" aria-label="불러올 기록 코드" placeholder="복사해 둔 기록 코드를 붙여 넣으세요"></textarea>
    <div class="actions"><button class="ghost" id="xLoad">코드로 불러오기</button>
      <label class="ghost" style="display:inline-block;cursor:pointer">파일로 불러오기<input type="file" id="xPick" accept=".json,.txt,application/json,text/plain" hidden></label></div>
    <p class="note" id="xMsg" role="status" aria-live="polite"></p>
  </section>`;
}
function bindXfer(){
  const msg=t=>{const m=$.querySelector("#xMsg");if(m)m.textContent=t};
  const load=text=>{const inc=decHist(text);
    if(!inc||!inc.length){msg("기록 코드를 읽지 못했습니다. 코드 전체를 빠짐없이 붙여 넣었는지 확인하세요.");return}
    const r=mergeHist(inc); report(`기록 ${r.add}개를 불러왔습니다.${r.dup?` (이미 있던 기록 ${r.dup}개는 건너뜀)`:""}`);
  };
  const c=$.querySelector("#xCopy");
  if(c) c.onclick=()=>{
    const code=encHist(getHist()), out=$.querySelector("#xOut");
    const show=()=>{out.value=code;out.hidden=false;out.focus();out.select();msg("자동 복사가 막혀 있습니다. 위 칸의 코드를 전체 선택해 복사하세요.")};
    try{navigator.clipboard.writeText(code).then(()=>msg(`기록 ${getHist().length}개를 코드로 복사했습니다. 다른 기기의 '나의 경영 리포트'에서 붙여 넣으세요.`),show)}catch(e){show()}
  };
  const f=$.querySelector("#xFile");
  if(f) f.onclick=()=>{
    const d=new Date(), name=`기업살리기-기록-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(getHist())],{type:"application/json"})); a.download=name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    msg(`${name} 파일로 저장했습니다.`);
  };
  const l=$.querySelector("#xLoad"); if(l) l.onclick=()=>load($.querySelector("#xIn").value);
  const p=$.querySelector("#xPick");
  if(p) p.onchange=()=>{const file=p.files&&p.files[0]; if(!file) return;
    const rd=new FileReader(); rd.onload=()=>load(rd.result); rd.onerror=()=>msg("파일을 읽지 못했습니다."); rd.readAsText(file)};
}

function report(flash){
  setTheme(CS.id);
  const hist=getHist();
  const head=`<header class="cover">
    <div class="band"><span class="tag">누적 기록</span><h1>나의 경영 리포트</h1>
      <p>지금까지 끝낸 위기를 모아 종합 경영 능력, 세부 능력, 경영 성향, 회사별·위기 유형별 강점과 약점을 보여 줍니다.</p></div>
  </header>${tabs("report")}`;
  if(!hist.length){
    $.innerHTML=`${head}<div class="empty"><b>아직 끝낸 위기가 없습니다.</b><p class="muted">위기를 하나 끝내면 종합 경영 능력, 성향 분포, 영역별 비중, 회사별 적합도가 여기에 쌓입니다.</p><button class="cta" id="pick">회사 살리러 가기</button></div>
    ${xferCard(false)}`;
    bindNav(); bindXfer(); $.querySelector("#pick").onclick=()=>go("home");
    if(flash){const m=$.querySelector("#xMsg");if(m)m.textContent=flash} return;
  }
  const bestById={}; hist.forEach(h=>{bestById[h.id]=Math.max(bestById[h.id]??-1,h.t)});
  const ids=Object.keys(bestById).filter(id=>TAGS[id]);
  const index=avg(ids.map(id=>bestById[id]));
  const g=GRADES.find(x=>index>=x[0]);
  const cnt={};SKEYS.forEach(k=>cnt[k]=sum(hist.map(h=>(h.cnt&&h.cnt[k])||0)));
  const nPick=sum(SKEYS.map(k=>cnt[k]));
  const dims=DIMS.map((_,k)=>avg(hist.map(h=>(h.dims&&h.dims[k])||0)));
  const byCause=CAUSES.map(c=>({c,v:avg(ids.filter(id=>TAGS[id].includes(c)).map(id=>bestById[id]))}));
  const byGroup=GROUPS.map(gr=>({t:gr.t,v:avg(ids.filter(id=>SCN.find(s=>s.id===id).grp===gr.k).map(id=>bestById[id]))}));
  const byCo=COKEYS.map(k=>{const own=ids.filter(id=>SCN.find(s=>s.id===id).co===k);return {k,v:avg(own.map(id=>bestById[id])),n:own.length,all:SCN.filter(s=>s.co===k).length}});
  const starAll=sum(ids.map(id=>STARS[GRADES.find(x=>bestById[id]>=x[0])[1]]));
  const R=hist.filter(h=>h.ab);
  const aAvg=k=>avg(R.map(h=>h.ab[k]).filter(v=>v!=null));
  const pH=sum(R.map(h=>h.pr?h.pr[0]:0)), pD=sum(R.map(h=>h.pr?h.pr[1]:0));
  const kc={}; R.forEach(h=>Object.entries(h.kc||{}).forEach(([c,v])=>{kc[c]=kc[c]||[0,0];kc[c][0]+=v[0];kc[c][1]+=v[1]}));
  const kl=Object.entries(kc).map(([c,v])=>({c,v:Math.round(v[0]/v[1]),n:v[1]})).sort((a,b)=>b.v-a.v||b.n-a.n);
  const hAvg=avg(hist.filter(h=>h.d==="hard").map(h=>h.t)), nAvg=avg(hist.filter(h=>h.d==="normal").map(h=>h.t));
  const toN=sum(hist.map(h=>h.to||0));
  const abv={dx:aAvg("dx"),judge:aAvg("judge"),adapt:aAvg("adapt"),bal:aAvg("bal"),pred:pD?Math.round(pH/pD*100):null,
    concept:kl.length?avg(kl.map(x=>x.v)):null,press:hAvg!=null&&nAvg?Math.min(100,Math.round(hAvg/nAvg*100)):null};
  const negCnt=DIMS.map((_,k)=>R.filter(h=>h.neg&&h.neg.includes(k)).length);
  const abEx={
    dx:R.length?`사전 진단 ${R.filter(h=>h.ab.dx!=null).length}번 가운데 1순위를 맞힌 비율 ${avg(R.filter(h=>h.ab.dx!=null).map(h=>h.ab.dx===100?100:0))??"–"}%`:"",
    pred:pD?`예측 ${pD}번 가운데 ${pH}번 맞음 (쉬움 난이도는 제외)`:"보통·어려움 난이도에서 결정할 때마다 예측하면 계산됩니다.",
    concept:kl.length?`개념 ${kl.length}개의 평균. 아래 '개념별 적용력'에서 개념마다 볼 수 있습니다.`:"",
    press:abv.press!=null?`어려움 평균 ${hAvg}점 ÷ 보통 평균 ${nAvg}점 · 시간 초과 ${toN}번`:"보통과 어려움 난이도를 모두 도전하면 계산됩니다.",
    bal:negCnt.some(x=>x)?`가장 자주 비워 둔 영역: <b>${esc(DIMS[negCnt.indexOf(Math.max(...negCnt))])}</b> (${Math.max(...negCnt)}번)`:""
  };
  const abVals=ABS.map(a=>abv[a[0]]).filter(v=>v!=null), abTop=abVals.length?Math.max(...abVals):null;
  const abCard=`<section class="q"><div class="q-h"><h2>능력 진단</h2></div>
    <p class="q-sub">성향과 따로 본 능력입니다. 0~100으로 표시하고, 능력 평가가 생긴 뒤의 도전 ${R.length}번으로 계산합니다.</p>
    <div class="dims">${ABS.map(([k,nm,d])=>abRow(nm,abv[k],`${esc(d)}${abEx[k]?`<br>${abEx[k]}`:""}`,abv[k]!=null&&abv[k]===abTop)).join("")}</div>
  </section>`;
  const kRows=a=>`<div class="dims">${a.map(x=>`<div class="dim-row"><div class="h"><span>${esc(x.c)}<small>${x.n}단계</small></span><b class="num">${x.v}</b></div><div class="track"><i style="width:${x.v}%"></i></div></div>`).join("")}</div>`;
  const kCard=kl.length?`<section class="q"><div class="q-h"><h2>개념별 적용력</h2></div>
    <p class="q-sub">『초거대 위협』 개념이 걸린 단계에서 고른 선택의 적합도 평균입니다. 그 단계에서 나온 선지 중 최고치를 100으로 봅니다.</p>
    ${kl.length>8?`<div class="kgrid"><div><h3>강한 개념</h3>${kRows(kl.slice(0,4))}</div><div><h3>약한 개념</h3>${kRows(kl.slice(-4).reverse())}</div></div>`:kRows(kl)}
  </section>`:"";
  const whys=[];
  R.slice().reverse().forEach(h=>{const s=SCN.find(x=>x.id===h.id);if(!s||!Array.isArray(h.why))return;
    h.why.forEach((w,n)=>{if(w&&whys.length<8&&s.steps[n])whys.push({s,n,w,sty:h.sty&&h.sty[n]})})});
  const whyCard=`<section class="q"><div class="q-h"><h2>결정 이유 기록</h2></div>
    <p class="q-sub">결정할 때 적은 이유 가운데 최근 8개입니다. 점수에는 들어가지 않습니다. 선생님이나 모둠과 이유를 나눌 때 쓰세요.</p>
    ${whys.length?`<div class="rev">${whys.map(x=>`<div class="rev-item">
      <div class="note">${esc(coName(x.s.co))} · ${esc(x.s.title)} · ${esc(x.s.steps[x.n].t)}</div>
      ${x.sty?`<div class="a"><span class="chip sty">${esc(styName(x.sty))}</span> ${esc(x.s.steps[x.n].g)}</div>`:""}
      <div class="why">${esc(x.w)}</div></div>`).join("")}</div>`:`<p class="muted">아직 적은 이유가 없습니다. 결정할 때 '결정 메모'의 이유 칸에 적으면 여기에 모입니다.</p>`}
  </section>`;
  const diag=[];
  const abList=ABS.filter(a=>abv[a[0]]!=null).map(a=>({n:a[1],v:abv[a[0]]})).sort((a,b)=>b.v-a.v);
  if(abList.length>=2&&abList[0].v!==abList[abList.length-1].v) diag.push(`능력 가운데 <b>${esc(abList[0].n)}</b>(${abList[0].v})이 가장 강하고, <b>${esc(abList[abList.length-1].n)}</b>(${abList[abList.length-1].v})이 가장 약합니다.`);
  if(abv.dx!=null&&abv.judge!=null){
    if(abv.dx-abv.judge>=20) diag.push("위기 진단은 맞게 하지만 실제 결정은 다른 영역에 무게를 두는 편입니다. 알고 있는 우선순위를 결정으로 옮기는 연습이 필요합니다.");
    else if(abv.judge-abv.dx>=20) diag.push("사전 진단에서는 우선순위를 다르게 꼽았지만, 실제 결정은 핵심 영역을 잘 챙겼습니다. 이유를 따지기보다 감각으로 판단하는 편입니다.");
  }
  if(abv.press!=null&&abv.press<90) diag.push(`시간 제한이 있으면 적합도가 보통 난이도의 ${abv.press}% 수준으로 떨어집니다.`);
  const dmax=dims.indexOf(Math.max(...dims)), dmin=dims.indexOf(Math.min(...dims));
  diag.push(`가장 많이 챙긴 영역은 <b>${esc(DIMS[dmax])}</b>(${dims[dmax]}), 가장 덜 챙긴 영역은 <b>${esc(DIMS[dmin])}</b>(${dims[dmin]})입니다.`);
  const cov=byCo.filter(x=>x.v!=null).sort((a,b)=>b.v-a.v);
  if(cov.length>=2&&cov[0].v!==cov[cov.length-1].v) diag.push(`<b>${esc(COS[cov[0].k].ind)}</b> 회사를 살릴 때 가장 강하고(${cov[0].v}점), <b>${esc(COS[cov[cov.length-1].k].ind)}</b> 회사에서 가장 약합니다(${cov[cov.length-1].v}점).`);
  const cv=byCause.filter(x=>x.v!=null).sort((a,b)=>b.v-a.v);
  if(cv.length>=2&&cv[0].v!==cv[cv.length-1].v) diag.push(`<b>${esc(cv[0].c)}</b> 위기에서 적합도가 가장 높고(${cv[0].v}점), <b>${esc(cv[cv.length-1].c)}</b> 위기에서 가장 낮습니다(${cv[cv.length-1].v}점).`);
  const topS=SKEYS.slice().sort((a,b)=>cnt[b]-cnt[a])[0];
  if(nPick){const pct=Math.round(cnt[topS]/nPick*100);diag.push(`전체 선택의 ${pct}%가 <b>${STY[topS].n}</b>입니다.${pct>=50?" 한 성향에 많이 기울어 있어, 그 성향의 약점이 드러나는 위기에서 점수가 떨어질 수 있습니다.":" 여러 성향을 상황에 맞춰 섞어 쓰고 있습니다."}`)}
  if(byGroup.every(x=>x.v!=null)&&byGroup[0].v!==byGroup[1].v){const hi=byGroup[0].v>byGroup[1].v?byGroup[0]:byGroup[1];diag.push(`피해 최소화(${byGroup[0].v}점)와 이익 극대화(${byGroup[1].v}점) 가운데 <b>${hi.t}</b> 상황에 더 강합니다.`)}
  const untried=byCo.filter(x=>!x.n).map(x=>coName(x.k));
  if(untried.length) diag.push(`아직 살려 보지 않은 회사: ${esc(untried.join(", "))}`);
  const fmt=t=>{const d=new Date(t);return `${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
  const mainOf=c=>{if(!c)return "";const k=SKEYS.slice().sort((a,b)=>(c[b]||0)-(c[a]||0))[0];return c[k]?STY[k].n:"결정 지연"};
  $.innerHTML=`${head}
  <section class="score">
    <div class="band">
      <div class="n">${index}<small> / 100점</small></div>
      <div class="g"><span class="grade">종합 경영 능력 ${g[1]}등급</span><b>${g[2]}</b></div>
      <span class="medal" aria-hidden="true">${g[1]}</span>
    </div>
    <div class="sub"><span>도전한 위기 ${ids.length}개의 최고 위기 적합도 평균</span></div>
  </section>
  <div class="stats">
    <div class="stat"><b class="num">${ids.length}<small class="muted" style="font-size:15px"> / ${SCN.length}</small></b><span>도전한 위기</span></div>
    <div class="stat"><b class="num">${starAll}<small class="muted" style="font-size:15px"> / ${SCN.length*3}</small></b><span>모은 별</span></div>
    <div class="stat"><b class="num">${hist.length}</b><span>총 도전 횟수</span></div>
  </div>
  <section class="q"><div class="q-h"><h2>진단</h2></div><ul class="diag">${diag.map(x=>`<li>${x}</li>`).join("")}</ul></section>
  <section class="q"><div class="q-h"><h2>회사별 적합도</h2></div>
    <div class="dims">${byCo.map(x=>`
      <div class="dim-row ${x.v==null?"na":""} ${cov.length&&x.v===cov[0].v?"top":""}">
        <div class="h"><span>${esc(coName(x.k))}<small>${esc(COS[x.k].ind)} · ${x.n}/${x.all}개</small></span><b class="num">${x.v==null?"도전 전":x.v}</b></div>
        <div class="track"><i style="width:${x.v||0}%"></i></div>
      </div>`).join("")}</div>
  </section>
  ${abCard}
  ${kCard}
  <section class="q"><div class="q-h"><h2>종합 경영 성향</h2></div><p class="q-sub">모든 도전에서 고른 선택 ${nPick}개를 합친 분포입니다.</p>${styleBlock(cnt,nPick)}</section>
  <section class="q"><div class="q-h"><h2>영역별 평균 비중</h2></div><p class="q-sub">도전마다 영역별로 얻을 수 있었던 최대치 대비 비율의 평균입니다.</p>${dimBlock(dims)}</section>
  <section class="q"><div class="q-h"><h2>위기 유형별 적합도</h2></div>
    <div class="dims">${byCause.map(x=>`
      <div class="dim-row ${x.v==null?"na":""} ${cv.length&&x.v===cv[0].v?"top":""}">
        <div class="h"><span>${esc(x.c)}</span><b class="num">${x.v==null?"도전 전":x.v}</b></div>
        <div class="track"><i style="width:${x.v||0}%"></i></div>
      </div>`).join("")}</div>
    <div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))">${byGroup.map(x=>`<div class="stat"><b class="num">${x.v==null?"–":x.v}</b><span>${x.t}</span></div>`).join("")}</div>
  </section>
  ${whyCard}
  <section class="q"><div class="q-h"><h2>최근 기록</h2></div>
    <div class="hist">${hist.slice(-10).reverse().map(h=>{const s=SCN.find(x=>x.id===h.id);return s?`
      <div class="hrow"><span>${esc(s.title)}</span><span class="s num">${h.t}</span>
      <span class="m">${fmt(h.at)} · ${esc(coName(recCo(h)))} · ${DIFF[h.d]?DIFF[h.d].n:""} · ${esc(mainOf(h.cnt))}</span></div>`:""}).join("")}</div>
  </section>
  ${flash?`<p class="flash" role="status">${esc(flash)}</p>`:""}
  ${xferCard(true)}
  <div class="actions" id="resetBox"><button class="danger" id="reset">기록 모두 지우기</button></div>`;
  bindNav(); bindXfer();
  if(flash){const x=$.querySelector("#xfer");if(x&&x.scrollIntoView)x.scrollIntoView({block:"start"})}
  $.querySelector("#reset").onclick=()=>{
    const box=$.querySelector("#resetBox");
    box.innerHTML=`<span style="align-self:center;font-size:14px">기록 ${hist.length}개를 모두 지웁니다. 되돌릴 수 없습니다.</span><button class="cta" id="yes">지우기</button><button class="ghost" id="no">취소</button>`;
    box.querySelector("#yes").onclick=()=>{store.set(HKEY,[]);report()};
    box.querySelector("#no").onclick=()=>report();
  };
}
window.addEventListener("hashchange",route);
route();
</script>

</body>
</html>
